# ═════════════════════════════════════════════════════════════════════════════
#  KONFIGURACJA PANELU – tylko ten plik edytujesz na co dzień.
#
#  Encje wyciągniesz z HA zapytaniem z tools/ha_entities.jinja
#  (Narzędzia deweloperskie → Szablon). Po zmianie: commit + push →
#  GitHub Actions zbuduje firmware → panel zaktualizuje się przez OTA.
#
#  Ikony: $ic_<nazwa> – lista w core/theme.yaml
#  Pulpit nieużywany? ustaw hide_page_xxx: "true" (zniknie z przewijania).
#  Linie z "SPRAWDŹ" to moje założenia – popraw, jeśli źle trafiłem.
# ═════════════════════════════════════════════════════════════════════════════

substitutions:
  # ── Belka główna ───────────────────────────────────────────────────────────
  balcony_temp_entity: sensor.stacja_pogody_esp32_bme280_temperature   # SPRAWDŹ: stacja pogody na balkonie
  rain_entity: binary_sensor.tr_czujnik_deszczu_rain                    # on = pada
  rain_states: "on"
  humidity_entity: sensor.stacja_pogody_esp32_bme280_humidity
  pressure_entity: sensor.stacja_pogody_esp32_bme280_pressure
  weather_entity: weather.forecast_dom                                  # prognoza (dotknięcie pogody na belce)
  # Pomocnik-szablon w HA z ikonami stref: "marek=home;ania=briefcase;…" (README)
  # Przycisk "Wychodzę" (Teraz): wyłącza TYLKO te encje. Bez pralki, suszarki,
  # serwera, drukarki 3D i komputerów – celowo, nie dopisuj ich.
  leave_entities: "switch.sn_oswietlenie_glowne,switch.sn_swiatlo_sciana,switch.kc_oswietlenie_l1,switch.kc_oswietlenie_l2,light.sp_swiatlo,switch.sp_lampka_tasmota,switch.pd_oswietlenie,light.lz_swiatlo_l1,light.lz_swiatlo_l2,light.tl_oswietlenie,light.tl_lustro,light.gb_swiatlo,light.pr_swiatlo,switch.tasmota_tasmota2,switch.sn_ekspres,switch.czajnik,switch.okap,media_player.telewizor_2,media_player.living_room_ue40h6700,media_player.playstation_5"
  leave_desc: "Wszystkie światła, ekspres, czajnik, okap, telewizory i PS5. Pralka, suszarka, serwer i drukarka 3D zostają włączone."
  # Zamek drzwi wejściowych i strefy alarmu Satel (belka + alerty)
  lock_entity: lock.aqara_smart_lock_u200
  alarm_1: alarm_control_panel.wejscie
  alarm_1_name: "Wejście"
  alarm_2: alarm_control_panel.salon
  alarm_2_name: "Salon z Aneksem"
  alarm_3: alarm_control_panel.pokoj_dzieci
  alarm_3_name: "Sypialnia Dzieci"
  alarm_4: alarm_control_panel.sypialnia_glowna
  alarm_4_name: "Sypialnia Główna"
  alarm_5: alarm_control_panel.garderoba
  alarm_5_name: "Garderoba"
  zones_entity: sensor.lokalizacja                                      # SPRAWDŹ: nazwa pomocnika
  # serwer: działa, gdy gniazdko Tasmota-Server pobiera > server_power_min W
  server_power_entity: sensor.tasmota_server_energy_power
  server_power_min: "20"

  # ── Ekran ──────────────────────────────────────────────────────────────────
  screen_timeout_default: "10"   # min bez dotyku i bez ruchu → wygaszenie (zmienisz też w HA / WWW)
  home_return_default: "60"      # s – powrót na pulpit główny
  touch_swap_xy: "false"
  touch_mirror_x: "false"
  touch_mirror_y: "false"

  # ── Pulpity ────────────────────────────────────────────────────────────────
  hide_page_lights: "false"
  hide_page_sockets: "false"
  hide_page_heating: "false"
  hide_page_car: "false"
  hide_page_vacuum: "false"
  hide_page_appliances: "false"
  hide_page_plants: "false"
  hide_page_school: "false"

packages:
  # ── Domownicy (belka, max 4: slot 0-3) ─────────────────────────────────────
  person_1: !include { file: ../tiles/person.yaml, vars: { uid: person_1, slot: 0, name: "Marek",    entity: person.marek } }
  person_2: !include { file: ../tiles/person.yaml, vars: { uid: person_2, slot: 1, name: "Ania",     entity: person.ania } }
  person_3: !include { file: ../tiles/person.yaml, vars: { uid: person_3, slot: 2, name: "Gabrysia", entity: person.gabrysia } }
  person_4: !include { file: ../tiles/person.yaml, vars: { uid: person_4, slot: 3, name: "Wiktor",   entity: person.wiktorek } }

  # ── Bezpieczeństwo: zalanie, okna, drzwi (na Teraz tylko gdy coś się dzieje) ──
  leak_lz: !include { file: ../tiles/leak.yaml, vars: { uid: leak_lz, name: "Łazienka",      entity: binary_sensor.lz_czujnik_zalania_water_leak } }
  leak_pr: !include { file: ../tiles/leak.yaml, vars: { uid: leak_pr, name: "Pralnia",       entity: binary_sensor.pr_czujnik_zalania_water_leak } }
  leak_kc: !include { file: ../tiles/leak.yaml, vars: { uid: leak_kc, name: "Kuchnia – filtr", entity: binary_sensor.kc_filtr_kuna_water_leak } }
  door_wj: !include { file: ../tiles/contact.yaml, vars: { uid: door_wj, name: "Drzwi wejściowe", icon: $ic_door_open, entity: binary_sensor.wejscie_myggbett_door_window_sensor_drzwi, battery_entity: sensor.wejscie_myggbett_door_window_sensor_bateria, rain_check: "false" } }
  # WYŁĄCZONE: czujnik okna w salonie pokazuje błędnie – włącz z powrotem po naprawie
  # win_sn:  !include { file: ../tiles/window.yaml, vars: { uid: win_sn, name: "Okno salon",        icon: $ic_window_open_variant, entity: binary_sensor.sn_salon_okno_contact, battery_entity: sensor.sn_salon_okno_battery, rain_check: "true", climate_entity: climate.sn_thermostat } }
  win_sp:  !include { file: ../tiles/window.yaml, vars: { uid: win_sp, name: "Okno sypialnia",    icon: $ic_window_open_variant, entity: binary_sensor.sp_okno_contact,       battery_entity: sensor.sp_okno_battery,       rain_check: "true", climate_entity: climate.sp_thermostat } }
  win_pd:  !include { file: ../tiles/window.yaml, vars: { uid: win_pd, name: "Okno pokój dzieci", icon: $ic_window_open_variant, entity: binary_sensor.pd_okno_contact,       battery_entity: sensor.pd_okno_battery,       rain_check: "true", climate_entity: climate.pd_themostat } }

  # ── Zajętość: toaleta (2 czujniki ruchu), łazienka (czujnik obecności) ────
  occ_tl: !include { file: ../tiles/occupied.yaml, vars: { uid: occ_tl, name: "Toaleta", icon: $ic_toilet, entity: binary_sensor.tl_czujnik_ruchu_occupancy, entity2: binary_sensor.tl_czujka_ruchu_occupancy } }
  occ_lz: !include { file: ../tiles/occupied.yaml, vars: { uid: occ_lz, name: "Łazienka", icon: $ic_shower, entity: binary_sensor.lz_czujnik_obecnosci_occupancy, entity2: binary_sensor.lz_czujnik_obecnosci_occupancy } }

  # ── Szkoła: nowości z Librusa, jutrzejsze sprawdziany, komputery dzieci ────
  lib_gabi: !include { file: ../tiles/librus_news.yaml, vars: { uid: lib_gabi, name: "Gabrysia", grades_entity: sensor.szkola_librus_gabriela_sobilo_oceny, msg_entity: sensor.szkola_librus_gabriela_sobilo_wiadomosci, notes_entity: sensor.szkola_librus_gabriela_sobilo_uwagi } }
  lib_wik:  !include { file: ../tiles/librus_news.yaml, vars: { uid: lib_wik,  name: "Wiktor",   grades_entity: sensor.librus_wiktor_sobilo_oceny,          msg_entity: sensor.librus_wiktor_sobilo_wiadomosci,          notes_entity: sensor.szkola_librus_wiktor_sobilo_uwagi } }
  test_gabi: !include { file: ../tiles/kid_tests.yaml, vars: { uid: test_gabi, name: "Gabrysia", calendar: calendar.librus_terminarz } }
  test_wik:  !include { file: ../tiles/kid_tests.yaml, vars: { uid: test_wik,  name: "Wiktor",   calendar: calendar.librus_wiktor_sobilo_kartkowki_i_klasowki } }
  pc_wik:  !include { file: ../tiles/in_use.yaml, vars: { uid: pc_wik,  name: "PC Wiktora", icon: $ic_desktop_tower_monitor, entity: binary_sensor.wintimeguard_pc_wiktor_uzytkownik_aktywny, entity2: binary_sensor.wintimeguard_pc_wiktor_uzytkownik_aktywny } }
  pc_gabi: !include { file: ../tiles/in_use.yaml, vars: { uid: pc_gabi, name: "Mac Gabi",   icon: $ic_desktop_tower_monitor, entity: binary_sensor.mactimeguard_pc_gabi_uzytkownik_aktywny,  entity2: binary_sensor.mactimeguard_pc_gabi_uzytkownik_aktywny } }

  # ── Auto: ładowanie i opony ──────────────────────────────────────────────
  car_chg: !include { file: ../tiles/car_charge.yaml, vars: { uid: car_chg, plug_entity: binary_sensor.mg_hs_charging_gun_state_2, soc_entity: sensor.mg_hs_state_of_charge_2, remaining_entity: sensor.mg_hs_remaining_charging_time_2, status_entity: sensor.mg_hs_charging_status_2, low_soc: "30" } }
  car_tyres: !include { file: ../tiles/tyres.yaml, vars: { uid: car_tyres, fl: sensor.mg_hs_tyre_pressure_front_left_2, fr: sensor.mg_hs_tyre_pressure_front_right_2, rl: sensor.mg_hs_tyre_pressure_rear_left_2, rr: sensor.mg_hs_tyre_pressure_rear_right_2, min_bar: "2.0", max_diff: "0.3" } }

  # ── Garderoba z serwerem: temperatura ─────────────────────────────────────
  gb_hot: !include { file: ../tiles/alert_threshold.yaml, vars: { uid: gb_hot, entity: sensor.gb_server_temperature, name: "Temperatura garderoby", message: "Garderoba (serwer): gorąco", icon: $ic_thermometer_alert, mode: above, threshold: 32, hysteresis: 1, unit: "°", decimals: 0, min: 0, max: 60 } }

  # ── Odkurzacz: części do wymiany ─────────────────────────────────────────
  vac_filter: !include { file: ../tiles/alert_threshold.yaml, vars: { uid: vac_filter, entity: sensor.x40_ultra_complete_filter_left, name: "Filtr odkurzacza", message: "Odkurzacz: wymień filtr", icon: $ic_air_filter, mode: below, threshold: 10, hysteresis: 2, unit: "%", decimals: 0, min: 0, max: 100 } }
  vac_main: !include { file: ../tiles/alert_threshold.yaml, vars: { uid: vac_main, entity: sensor.x40_ultra_complete_main_brush_left, name: "Szczotka główna", message: "Odkurzacz: szczotka główna", icon: $ic_air_filter, mode: below, threshold: 10, hysteresis: 2, unit: "%", decimals: 0, min: 0, max: 100 } }
  vac_side: !include { file: ../tiles/alert_threshold.yaml, vars: { uid: vac_side, entity: sensor.x40_ultra_complete_side_brush_left, name: "Szczotka boczna", message: "Odkurzacz: szczotka boczna", icon: $ic_air_filter, mode: below, threshold: 10, hysteresis: 2, unit: "%", decimals: 0, min: 0, max: 100 } }
  vac_sens: !include { file: ../tiles/alert_threshold.yaml, vars: { uid: vac_sens, entity: sensor.x40_ultra_complete_sensor_dirty_left, name: "Czujniki odkurzacza", message: "Odkurzacz: wyczyść czujniki", icon: $ic_air_filter, mode: below, threshold: 10, hysteresis: 2, unit: "%", decimals: 0, min: 0, max: 100 } }


  # ── Wyjazd: wszyscy daleko (>50 km) ──────────────────────────────────────
  trip: !include { file: ../tiles/trip.yaml, vars: { uid: trip, entity: binary_sensor.wszyscy_daleko_50km } }

  # ── Pulpit 8: SZKOŁA (Gabrysia | Wiktor) ─────────────────────────────────
