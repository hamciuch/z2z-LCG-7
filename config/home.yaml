# ═════════════════════════════════════════════════════════════════════════════
#  KONFIGURACJA PANELU – tylko ten plik edytujesz na co dzień.
#
#  Encje wyciągniesz z HA zapytaniem z tools/ha_entities.jinja
#  (Narzędzia deweloperskie → Szablon). Po zmianie: commit + push →
#  GitHub Actions zbuduje firmware → panel zaktualizuje się przez OTA.
#
#  Ikony: $ic_<nazwa> – lista w core/theme.yaml
#  Pulpit nieużywany? ustaw hide_page_xxx: "true" (zniknie z przewijania).
#  Linie z "SPRAWDŹ" to moje założenia – popraw, jeśli źle trafiłem.
# ═════════════════════════════════════════════════════════════════════════════

substitutions:
  # ── Belka główna ───────────────────────────────────────────────────────────
  balcony_temp_entity: sensor.stacja_pogody_esp32_bme280_temperature   # SPRAWDŹ: stacja pogody na balkonie
  rain_entity: binary_sensor.tr_czujnik_deszczu_rain                    # on = pada
  rain_states: "on"
  humidity_entity: sensor.stacja_pogody_esp32_bme280_humidity
  pressure_entity: sensor.stacja_pogody_esp32_bme280_pressure
  weather_entity: weather.forecast_dom                                  # prognoza (dotknięcie pogody na belce)
  # Pomocnik-szablon w HA z ikonami stref: "marek=home;ania=briefcase;…" (README)
  zones_entity: sensor.lokalizacja                                      # SPRAWDŹ: nazwa pomocnika
  # serwer: działa, gdy gniazdko Tasmota-Server pobiera > server_power_min W
  server_power_entity: sensor.tasmota_server_energy_power
  server_power_min: "20"

  # ── Ekran ──────────────────────────────────────────────────────────────────
  screen_timeout_default: "10"   # min bez dotyku i bez ruchu → wygaszenie (zmienisz też w HA / WWW)
  home_return_default: "60"      # s – powrót na pulpit główny
  touch_swap_xy: "false"
  touch_mirror_x: "false"
  touch_mirror_y: "false"

  # ── Pulpity ────────────────────────────────────────────────────────────────
  hide_page_lights: "false"
  hide_page_sockets: "false"
  hide_page_heating: "false"
  hide_page_car: "false"
  hide_page_vacuum: "false"
  hide_page_appliances: "false"
  hide_page_plants: "false"

packages:
  # ── Domownicy (belka, max 4: slot 0-3) ─────────────────────────────────────
  person_1: !include { file: ../tiles/person.yaml, vars: { uid: person_1, slot: 0, name: "Marek",    entity: person.marek } }
  person_2: !include { file: ../tiles/person.yaml, vars: { uid: person_2, slot: 1, name: "Ania",     entity: person.ania } }
  person_3: !include { file: ../tiles/person.yaml, vars: { uid: person_3, slot: 2, name: "Gabrysia", entity: person.gabrysia } }
  person_4: !include { file: ../tiles/person.yaml, vars: { uid: person_4, slot: 3, name: "Wiktor",   entity: person.wiktorek } }

  # ── Pulpit 0: TERAZ – pokazują się tylko WŁĄCZONE (dotknięcie = wyłącz) ─────
  # Salon
  l_sn_glowne:  !include { file: ../tiles/active_light.yaml, vars: { uid: l_sn_glowne, name: "Salon",         icon: $ic_lightbulb, entity: switch.sn_oswietlenie_glowne } }
  l_sn_sciana:  !include { file: ../tiles/active_light.yaml, vars: { uid: l_sn_sciana, name: "Salon ściana",  icon: $ic_lightbulb, entity: switch.sn_swiatlo_sciana } }
  # Kuchnia
  l_kc_1:       !include { file: ../tiles/active_light.yaml, vars: { uid: l_kc_1, name: "Kuchnia 1", icon: $ic_lightbulb, entity: switch.kc_oswietlenie_l1 } }
  l_kc_2:       !include { file: ../tiles/active_light.yaml, vars: { uid: l_kc_2, name: "Kuchnia 2", icon: $ic_lightbulb, entity: switch.kc_oswietlenie_l2 } }
  # Sypialnia
  l_sp:         !include { file: ../tiles/active_light.yaml, vars: { uid: l_sp,     name: "Sypialnia",       icon: $ic_lightbulb, entity: light.sp_swiatlo } }
  l_sp_lampka:  !include { file: ../tiles/active_light.yaml, vars: { uid: l_sp_lampka, name: "Lampka sypialnia", icon: $ic_lightbulb, entity: switch.sp_lampka_tasmota } }
  # Pokój dzieci
  l_pd:         !include { file: ../tiles/active_light.yaml, vars: { uid: l_pd,     name: "Pokój dzieci",    icon: $ic_lightbulb, entity: switch.pd_oswietlenie } }
  # Łazienka / toaleta / garderoba / pralnia
  l_lz_1:       !include { file: ../tiles/active_light.yaml, vars: { uid: l_lz_1, name: "Łazienka 1", icon: $ic_lightbulb, entity: light.lz_swiatlo_l1 } }
  l_lz_2:       !include { file: ../tiles/active_light.yaml, vars: { uid: l_lz_2, name: "Łazienka 2", icon: $ic_lightbulb, entity: light.lz_swiatlo_l2 } }
  l_tl:         !include { file: ../tiles/active_light.yaml, vars: { uid: l_tl,   name: "Toaleta",    icon: $ic_lightbulb, entity: light.tl_oswietlenie } }
  l_tl_lustro:  !include { file: ../tiles/active_light.yaml, vars: { uid: l_tl_lustro, name: "Lustro toaleta", icon: $ic_lightbulb, entity: light.tl_lustro } }
  l_gb:         !include { file: ../tiles/active_light.yaml, vars: { uid: l_gb,   name: "Garderoba",  icon: $ic_lightbulb, entity: light.gb_swiatlo } }
  l_pr:         !include { file: ../tiles/active_light.yaml, vars: { uid: l_pr,   name: "Pralnia",    icon: $ic_lightbulb, entity: light.pr_swiatlo } }
  l_girlanda:   !include { file: ../tiles/active_light.yaml, vars: { uid: l_girlanda, name: "Girlanda", icon: $ic_string_lights, entity: switch.tasmota_tasmota2 } }
  # Telewizory / konsola (media_player: widoczny gdy nie jest off/standby)
  minecraft:    !include { file: ../tiles/game_server.yaml, vars: { uid: minecraft, name: "Minecraft", icon: $ic_minecraft, status_entity: binary_sensor.192_168_23_11_25565_status, players_entity: sensor.192_168_23_11_25565_players_online } }
  tv_salon:     !include { file: ../tiles/active.yaml, vars: { uid: tv_salon, name: "TV salon",     icon: $ic_television, entity: media_player.telewizor_2 } }   # SPRAWDŹ: telewizor / _2 / _3
  tv_sp:        !include { file: ../tiles/active.yaml, vars: { uid: tv_sp,    name: "TV sypialnia", icon: $ic_television, entity: media_player.living_room_ue40h6700 } }
  ps5:          !include { file: ../tiles/active.yaml, vars: { uid: ps5,      name: "PS5",          icon: $ic_gamepad,    entity: media_player.playstation_5 } }
  # Gniazdka wg poboru mocy [W]; dotknięcie wyłącza switch_entity ("" = nic nie robi)
  ekspres:  !include { file: ../tiles/active_power.yaml, vars: { uid: ekspres,  name: "Ekspres",     icon: $ic_coffee_maker,     entity: sensor.sn_ekspres_energy_power,  threshold: 5,  switch_entity: switch.sn_ekspres } }
  czajnik:  !include { file: ../tiles/active_power.yaml, vars: { uid: czajnik,  name: "Czajnik",     icon: $ic_kettle,           entity: sensor.czajnik_energy_power,     threshold: 50, switch_entity: switch.czajnik } }
  okap:     !include { file: ../tiles/active_power.yaml, vars: { uid: okap,     name: "Okap",        icon: $ic_fan,              entity: sensor.okap_energy_power,        threshold: 5,  switch_entity: switch.okap } }

  # Drukarka 3D (Bambu P1S) – kafelek TYLKO podczas druku, z godziną końca
  printer: !include
    file: ../tiles/printer.yaml
    vars:
      uid: printer
      name: "Drukarka 3D"
      status_entity: sensor.p1s_01p00a3a2600140_status_druku
      progress_entity: sensor.p1s_01p00a3a2600140_postep_drukowania
      end_entity: sensor.p1s_01p00a3a2600140_czas_zakonczenia
      printing_states: "running,prepare,pause,slicing,init"

  # Czujniki ruchu Satel – ruch wybudza ekran; 10 min bez ruchu i dotyku → wygaszenie.
  ruch_wejscie: !include { file: ../tiles/motion_wake.yaml, vars: { uid: ruch_wejscie, entity: binary_sensor.wejscie } }
  ruch_salon:   !include { file: ../tiles/motion_wake.yaml, vars: { uid: ruch_salon,   entity: binary_sensor.salon_z_aneksem } }
  ruch_sp_dz:   !include { file: ../tiles/motion_wake.yaml, vars: { uid: ruch_sp_dz,   entity: binary_sensor.sypialnia_dzieci } }
  ruch_sp_gl:   !include { file: ../tiles/motion_wake.yaml, vars: { uid: ruch_sp_gl,   entity: binary_sensor.sypialnia_glowna } }

  # ── Pulpit 1: ŚWIATŁA (wszystkie; dotknięcie = przełącz) ───────────────────
  sw_sn:      !include { file: ../tiles/light_toggle.yaml, vars: { uid: sw_sn,      name: "Salon",            icon: $ic_lightbulb, entity: switch.sn_oswietlenie_glowne } }
  sw_sn_sc:   !include { file: ../tiles/light_toggle.yaml, vars: { uid: sw_sn_sc,   name: "Salon ściana",     icon: $ic_lightbulb, entity: switch.sn_swiatlo_sciana } }
  sw_kc1:     !include { file: ../tiles/light_toggle.yaml, vars: { uid: sw_kc1,     name: "Kuchnia 1",        icon: $ic_lightbulb, entity: switch.kc_oswietlenie_l1 } }
  sw_kc2:     !include { file: ../tiles/light_toggle.yaml, vars: { uid: sw_kc2,     name: "Kuchnia 2",        icon: $ic_lightbulb, entity: switch.kc_oswietlenie_l2 } }
  sw_sp:      !include { file: ../tiles/light_toggle.yaml, vars: { uid: sw_sp,      name: "Sypialnia",        icon: $ic_lightbulb, entity: light.sp_swiatlo } }
  sw_sp_l:    !include { file: ../tiles/light_toggle.yaml, vars: { uid: sw_sp_l,    name: "Lampka sypialnia", icon: $ic_lightbulb, entity: switch.sp_lampka_tasmota } }
  sw_pd:      !include { file: ../tiles/light_toggle.yaml, vars: { uid: sw_pd,      name: "Pokój dzieci",     icon: $ic_lightbulb, entity: switch.pd_oswietlenie } }
  sw_lz1:     !include { file: ../tiles/light_toggle.yaml, vars: { uid: sw_lz1,     name: "Łazienka 1",       icon: $ic_lightbulb, entity: light.lz_swiatlo_l1 } }
  sw_lz2:     !include { file: ../tiles/light_toggle.yaml, vars: { uid: sw_lz2,     name: "Łazienka 2",       icon: $ic_lightbulb, entity: light.lz_swiatlo_l2 } }
  sw_tl:      !include { file: ../tiles/light_toggle.yaml, vars: { uid: sw_tl,      name: "Toaleta",          icon: $ic_lightbulb, entity: light.tl_oswietlenie } }
  sw_tl_l:    !include { file: ../tiles/light_toggle.yaml, vars: { uid: sw_tl_l,    name: "Lustro toaleta",   icon: $ic_lightbulb, entity: light.tl_lustro } }
  sw_gb:      !include { file: ../tiles/light_toggle.yaml, vars: { uid: sw_gb,      name: "Garderoba",        icon: $ic_lightbulb, entity: light.gb_swiatlo } }
  sw_pr:      !include { file: ../tiles/light_toggle.yaml, vars: { uid: sw_pr,      name: "Pralnia",          icon: $ic_lightbulb, entity: light.pr_swiatlo } }
  sw_gir:     !include { file: ../tiles/light_toggle.yaml, vars: { uid: sw_gir,     name: "Girlanda balkon",  icon: $ic_string_lights, entity: switch.tasmota_tasmota2 } }

  # ── Pulpit 2: GNIAZDKA i TASMOTY (moc w W; serwer tylko podgląd) ───────────
  # mode: toggle = od razu, confirm = pyta przed wyłączeniem, readonly = tylko podgląd
  so_ekspres: !include { file: ../tiles/socket.yaml, vars: { uid: so_ekspres, name: "Ekspres",          icon: $ic_coffee_maker,    entity: switch.sn_ekspres,              power_entity: sensor.sn_ekspres_energy_power,          mode: toggle } }
  so_czajnik: !include { file: ../tiles/socket.yaml, vars: { uid: so_czajnik, name: "Czajnik",          icon: $ic_kettle,          entity: switch.czajnik,                 power_entity: sensor.czajnik_energy_power,             mode: toggle } }
  so_okap:    !include { file: ../tiles/socket.yaml, vars: { uid: so_okap,    name: "Okap",             icon: $ic_fan,             entity: switch.okap,                    power_entity: sensor.okap_energy_power,                mode: toggle } }
  so_kc:      !include { file: ../tiles/socket.yaml, vars: { uid: so_kc,      name: "Gniazdko kuchnia", icon: $ic_socket,          entity: switch.kc_ganiazdkokuchnia,     power_entity: sensor.kc_ganiazdkokuchnia_power,        mode: toggle } }
  so_kuna:    !include { file: ../tiles/socket.yaml, vars: { uid: so_kuna,    name: "Filtr Kuna",       icon: $ic_water,           entity: switch.kc_filtr_kuna,           power_entity: sensor.kc_filtr_kuna_energy_power,       mode: toggle } }
  so_tv:      !include { file: ../tiles/socket.yaml, vars: { uid: so_tv,      name: "Telewizor",        icon: $ic_television,      entity: switch.telewizor,               power_entity: sensor.telewizor_energy_power,           mode: toggle } }
  so_ps5:     !include { file: ../tiles/socket.yaml, vars: { uid: so_ps5,     name: "PS5",              icon: $ic_gamepad,         entity: switch.ps5,                     power_entity: sensor.ps5_energy_power,                 mode: confirm } }
  so_kanapa:  !include { file: ../tiles/socket.yaml, vars: { uid: so_kanapa,  name: "Gniazdko kanapa",  icon: $ic_sofa,            entity: switch.sn_gniazdko_kanapa,      power_entity: sensor.sn_gniazdko_kanapa_power,         mode: toggle } }
  so_pady:    !include { file: ../tiles/socket.yaml, vars: { uid: so_pady,    name: "Ładowarka padów",  icon: $ic_gamepad,         entity: switch.ladowarka_pady,          power_entity: sensor.ladowarka_pady_energy_power,      mode: toggle } }
  so_sp_pc:   !include { file: ../tiles/socket.yaml, vars: { uid: so_sp_pc,   name: "Komputer SP",      icon: $ic_desk,            entity: switch.sp_komputer,             power_entity: sensor.sp_komputer_energy_power,         mode: confirm } }
  so_marek:   !include { file: ../tiles/socket.yaml, vars: { uid: so_marek,   name: "Gniazdko Marek",   icon: $ic_socket,          entity: switch.sp_gniazdko_marek,       power_entity: sensor.sp_gniazdko_marek_power,          mode: toggle } }
  so_ania:    !include { file: ../tiles/socket.yaml, vars: { uid: so_ania,    name: "Listwa Ani",       icon: $ic_power_plug,      entity: switch.sp_listwa_ani_tasmota,   power_entity: sensor.sp_listwa_ani_energy_power,       mode: toggle } }
  so_pd_pc:   !include { file: ../tiles/socket.yaml, vars: { uid: so_pd_pc,   name: "Komputer PD",      icon: $ic_desk,            entity: switch.pd_komputer,             power_entity: sensor.pd_komputer_energy_power,         mode: confirm } }
  so_pralka:  !include { file: ../tiles/socket.yaml, vars: { uid: so_pralka,  name: "Pralka",           icon: $ic_washing_machine, entity: switch.pokoj_dzieci_grillplats_plug, power_entity: sensor.pokoj_dzieci_grillplats_plug_moc, mode: confirm } }
  so_susz:    !include { file: ../tiles/socket.yaml, vars: { uid: so_susz,    name: "Suszarka",         icon: $ic_washing_machine, entity: switch.grillplats_plug,         power_entity: sensor.grillplats_plug_moc,              mode: confirm } }
  so_daga:    !include { file: ../tiles/socket.yaml, vars: { uid: so_daga,    name: "Daga Dreame",      icon: $ic_robot_vacuum,    entity: switch.lz_daga_dreame,          power_entity: sensor.lz_daga_dreame_energy_power,      mode: toggle } }
  so_tl:      !include { file: ../tiles/socket.yaml, vars: { uid: so_tl,      name: "Gniazdko TL",      icon: $ic_socket,          entity: switch.tl_gniazdko,             power_entity: sensor.tl_gniazdko_power,                mode: toggle } }
  so_3d:      !include { file: ../tiles/socket.yaml, vars: { uid: so_3d,      name: "Drukarka 3D",      icon: $ic_printer_3d,      entity: switch.drukarka3d,              power_entity: sensor.drukarka3d_energy_power,          mode: confirm } }
  so_druk:    !include { file: ../tiles/socket.yaml, vars: { uid: so_druk,    name: "Drukarka",         icon: $ic_printer_3d,      entity: switch.gb_drukarka,             power_entity: sensor.gb_drukarka_energy_power,         mode: toggle } }
  so_server:  !include { file: ../tiles/socket.yaml, vars: { uid: so_server,  name: "Serwer",           icon: $ic_server,          entity: switch.tasmota_server,          power_entity: sensor.tasmota_server_energy_power,      mode: readonly } }
  so_stacja:  !include { file: ../tiles/socket.yaml, vars: { uid: so_stacja,  name: "Stacja pogody",    icon: $ic_thermometer,     entity: switch.balkon_stacja_pogody,    power_entity: sensor.balkon_energy_power,              mode: toggle } }
  so_balkon:  !include { file: ../tiles/socket.yaml, vars: { uid: so_balkon,  name: "Balkon wolny",     icon: $ic_socket,          entity: switch.balkon_wolny,            power_entity: sensor.balkon_energy_power,              mode: toggle } }
  so_mc:      !include { file: ../tiles/vm_switch.yaml, vars: { uid: so_mc,     name: "Minecraft",        icon: $ic_minecraft,       entity: switch.esxi_vm,                 status_entity: sensor.esxi_vm_status_text,             mode: confirm } }
  so_taras:   !include { file: ../tiles/socket.yaml, vars: { uid: so_taras,   name: "Taras wolny",      icon: $ic_socket,          entity: switch.tasmota_3,               power_entity: sensor.tasmota_energy_power,             mode: toggle } }

  # ── Pulpit 3: OGRZEWANIE (głowice + czujniki Zigbee w pokojach) ────────────
  # Uwaga: głowice są w trybie "auto" (harmonogram) – ręczna zmiana zadanej może
  # zostać nadpisana przez harmonogram przy następnym kroku.
  h_salon: !include { file: ../tiles/climate.yaml, vars: { uid: h_salon, name: "Salon",        entity: climate.sn_thermostat, room_temp_entity: sensor.sn_temperatura_temperature } }
  h_sp:    !include { file: ../tiles/climate.yaml, vars: { uid: h_sp,    name: "Sypialnia",    entity: climate.sp_thermostat, room_temp_entity: sensor.sp_temperatura_temperature } }
  h_pd:    !include { file: ../tiles/climate.yaml, vars: { uid: h_pd,    name: "Pokój dzieci", entity: climate.pd_themostat,  room_temp_entity: sensor.pd_temperatura_temperature } }
  h_lz:    !include { file: ../tiles/climate.yaml, vars: { uid: h_lz,    name: "Łazienka",     entity: climate.lz_thermostat, room_temp_entity: sensor.lz_temperatura_temperature } }

  # ── Pulpit 4: SAMOCHÓD (MG HS) ─────────────────────────────────────────────
  # rząd 1: odczyty
  car_fuel:   !include { file: ../tiles/value_card.yaml, vars: { uid: car_fuel,   page: page_car, name: "Paliwo",          icon: $ic_gas_station,  entity: sensor.mg_hs_fuel_level_2,          unit: "%",   decimals: 0 } }
  car_frange: !include { file: ../tiles/value_card.yaml, vars: { uid: car_frange, page: page_car, name: "Zasięg paliwo",   icon: $ic_map_marker,   entity: sensor.mg_hs_fuel_range_2,          unit: " km", decimals: 0 } }
  car_erange: !include { file: ../tiles/value_card.yaml, vars: { uid: car_erange, page: page_car, name: "Zasięg prąd",     icon: $ic_car_electric, entity: sensor.mg_hs_electric_range_2,      unit: " km", decimals: 0 } }
  car_avg:    !include { file: ../tiles/value_card.yaml, vars: { uid: car_avg,    page: page_car, name: "Średnie spalanie", icon: $ic_gas_station,  entity: sensor.mg_ehs_srednie_spalanie,     unit: "",    decimals: 1 } }
  car_temp:   !include { file: ../tiles/value_card.yaml, vars: { uid: car_temp,   page: page_car, name: "Wnętrze",         icon: $ic_thermometer,  entity: sensor.mg_hs_interior_temperature_2, unit: "°",  decimals: 0 } }
  # rząd 2: stan i sterowanie
  car_charge: !include { file: ../tiles/text_card.yaml,  vars: { uid: car_charge, page: page_car, name: "Ładowanie",       icon: $ic_ev_station,   entity: sensor.mg_hs_charging_status_2 } }
  car_lock:   !include { file: ../tiles/text_card.yaml,  vars: { uid: car_lock,   page: page_car, name: "Zamek",           icon: $ic_lock,         entity: lock.mg_hs_lock_2 } }
  car_ac:     !include { file: ../tiles/toggle_card.yaml, vars: { uid: car_ac,    page: page_car, name: "Klimatyzacja (postój)", icon: $ic_air_conditioner, entity: switch.garaz_mg_hs_air_conditioning, info_entity: number.garaz_mg_hs_climate_target_temperature, info_suffix: "°" } }
  car_seat_l: !include { file: ../tiles/toggle_card.yaml, vars: { uid: car_seat_l, page: page_car, name: "Fotel kierowcy",  icon: $ic_fire, entity: switch.mg_hs_heated_seat_front_left_2,  info_entity: sensor.mg_hs_exterior_temperature_2, info_suffix: "° na zew." } }
  car_seat_r: !include { file: ../tiles/toggle_card.yaml, vars: { uid: car_seat_r, page: page_car, name: "Fotel pasażera",  icon: $ic_fire, entity: switch.mg_hs_heated_seat_front_right_2, info_entity: sensor.mg_hs_exterior_temperature_2, info_suffix: "° na zew." } }
  car_low: !include
    file: ../tiles/alert_threshold.yaml
    vars:
      uid: car_low
      entity: sensor.mg_hs_fuel_level_2
      name: "Paliwo w aucie"
      message: "Auto: mało paliwa"
      icon: $ic_gas_station
      mode: below
      threshold: 20
      hysteresis: 3
      unit: "%"
      decimals: 0
      min: 0
      max: 100
  car_open: !include { file: ../tiles/alert_state.yaml, vars: { uid: car_open, entity: lock.mg_hs_lock_2, message: "Auto jest otwarte", icon: $ic_lock_open, states: "unlocked,open", goto: 4 } }

  # ── Pulpit 5: ODKURZACZ Dreame X40 (tylko wybrane pomieszczenia) ───────────
  # Pomieszczenia z mapy "Dom" (ID segmentu = numer z aplikacji Dreame); nazwy możesz zmienić
  vac: !include { file: ../tiles/vacuum.yaml, vars: { name: "Odkurzacz", prefix: x40_ultra_complete } }
  vr_8: !include { file: ../tiles/vacuum_room.yaml, vars: { uid: vr_8, segment: 8, name: "Salon",              icon: $ic_sofa } }
  vr_1: !include { file: ../tiles/vacuum_room.yaml, vars: { uid: vr_1, segment: 1, name: "Główna Sypialnia 3", icon: $ic_bed } }
  vr_2: !include { file: ../tiles/vacuum_room.yaml, vars: { uid: vr_2, segment: 2, name: "Główna Sypialnia 2", icon: $ic_bed } }
  vr_6: !include { file: ../tiles/vacuum_room.yaml, vars: { uid: vr_6, segment: 6, name: "Pomieszczenie 6",    icon: $ic_home } }
  vr_7: !include { file: ../tiles/vacuum_room.yaml, vars: { uid: vr_7, segment: 7, name: "Korytarz",           icon: $ic_door } }
  vr_3: !include { file: ../tiles/vacuum_room.yaml, vars: { uid: vr_3, segment: 3, name: "Korytarz 2",         icon: $ic_door } }
  vr_4: !include { file: ../tiles/vacuum_room.yaml, vars: { uid: vr_4, segment: 4, name: "Łazienka",           icon: $ic_shower } }
  vr_5: !include { file: ../tiles/vacuum_room.yaml, vars: { uid: vr_5, segment: 5, name: "Łazienka 2",         icon: $ic_shower } }
  vac_ctrl: !include { file: ../tiles/vacuum_controls.yaml, vars: { prefix: x40_ultra_complete } }

  # ── Pulpit 6: AGD – zmywarka, pralka, suszarka ─────────────────────────────
  dish: !include
    file: ../tiles/dishwasher.yaml
    vars:
      uid: dish
      name: "Zmywarka"
      status_entity: sensor.zmywarka_do_naczyn_device_status
      phase_entity: sensor.zmywarka_do_naczyn_current_program_phase
      done_entity: binary_sensor.zmywarka_do_naczyn_program_done
      done_states: "on"
      door_entity: binary_sensor.zmywarka_do_naczyn_door        # SPRAWDŹ: on = drzwi otwarte?
      door_open_states: "on,open"
      remaining_entity: sensor.zmywarka_do_naczyn_current_program_remaining_time
  dish_salt: !include { file: ../tiles/alert_state.yaml, vars: { uid: dish_salt,  entity: binary_sensor.zmywarka_do_naczyn_salt_refill,      message: "Zmywarka: uzupełnij sól",          icon: $ic_dishwasher_alert, states: "on", goto: 6 } }
  dish_rinse: !include { file: ../tiles/alert_state.yaml, vars: { uid: dish_rinse, entity: binary_sensor.zmywarka_do_naczyn_rinse_aid_refill, message: "Zmywarka: uzupełnij nabłyszczacz", icon: $ic_dishwasher_alert, states: "on", goto: 6 } }

  pralka: !include
    file: ../tiles/appliance_power.yaml
    vars: { uid: pralka, name: "Pralka", icon: $ic_washing_machine, entity: sensor.pokoj_dzieci_grillplats_plug_moc, threshold: 5, finish_min: 5, finish_message: "Pralka skończyła – wyjmij pranie" }
  suszarka: !include
    file: ../tiles/appliance_power.yaml
    vars: { uid: suszarka, name: "Suszarka", icon: $ic_washing_machine, entity: sensor.grillplats_plug_moc, threshold: 5, finish_min: 3, finish_message: "Suszarka skończyła – wyjmij pranie" }

  # ── Pulpit 7: ROŚLINY (alert "Podlej" poniżej progu; progi zmienisz w HA/WWW)
  p_kaktus:   !include { file: ../tiles/plant.yaml, vars: { uid: p_kaktus,   name: "Kaktus",               entity: sensor.sn_kaktus_soil_moisture,                    threshold: 15 } }
  p_paprotka: !include { file: ../tiles/plant.yaml, vars: { uid: p_paprotka, name: "Paprotka",             entity: sensor.sn_paprotka_soil_moisture,                  threshold: 60 } }
  p_sans_d:   !include { file: ../tiles/plant.yaml, vars: { uid: p_sans_d,   name: "Sansewieria duża",     entity: sensor.sn_sansewieria_gwinejska_duza_soil_moisture, threshold: 30 } }
  p_sans_m:   !include { file: ../tiles/plant.yaml, vars: { uid: p_sans_m,   name: "Sansewieria mała",     entity: sensor.sn_sansewieria_gwinejska_mala_soil_moisture, threshold: 30 } }
  p_sans_o:   !include { file: ../tiles/plant.yaml, vars: { uid: p_sans_o,   name: "Sansewieria okno",     entity: sensor.sn_sansewieria_gwinejska_okno_soil_moisture, threshold: 30 } }
  p_filo:     !include { file: ../tiles/plant.yaml, vars: { uid: p_filo,     name: "Filodendron",          entity: sensor.sn_filodendron_soil_moisture,               threshold: 40 } }
  p_hedera:   !include { file: ../tiles/plant.yaml, vars: { uid: p_hedera,   name: "Hedera Eva",           entity: sensor.sn_hedera_eva_soil_moisture,                threshold: 40 } }
  p_ficus:    !include { file: ../tiles/plant.yaml, vars: { uid: p_ficus,    name: "Ficus",                entity: sensor.sn_hedera_eva_tv_soil_moisture,             threshold: 30 } }
