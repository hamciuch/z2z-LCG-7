    file: ../tiles/school_kid.yaml
    vars: { uid: sch_gabi, name: "Gabrysia", plan_calendar: calendar.dom_librus_gabriela_sobilo_plan_lekcji, avg_entity: sensor.szkola_librus_gabriela_sobilo_srednia_ocen, grades_entity: sensor.librus_gabriela_sobilo_wszystkie_oceny, student_entity: sensor.dom_librus_gabriela_sobilo_uczen, lucky_entity: sensor.dom_librus_gabriela_sobilo_szczesliwy_numerek, homework_entity: sensor.librus_gabriela_sobilo_zadania_domowe, test_entity: sensor.szkola_librus_gabriela_sobilo_najblizsza_kartkowka_lub_klasowka, msg_entity: sensor.szkola_librus_gabriela_sobilo_wiadomosci }
  sch_wik: !include
    file: ../tiles/school_kid.yaml
    vars: { uid: sch_wik, name: "Wiktor", plan_calendar: calendar.librus_wiktor_sobilo_plan_lekcji, avg_entity: sensor.librus_wiktor_sobilo_srednia_ocen, grades_entity: sensor.librus_wiktor_sobilo_wszystkie_oceny, student_entity: sensor.librus_wiktor_sobilo_uczen, lucky_entity: sensor.librus_wiktor_sobilo_szczesliwy_numerek_2, homework_entity: sensor.librus_wiktor_sobilo_zadania_domowe, test_entity: sensor.librus_wiktor_sobilo_najblizsza_kartkowka_lub_klasowka, msg_entity: sensor.librus_wiktor_sobilo_wiadomosci }

  # ── Plan dzieci (Z2Z Librus + zajęcia dodatkowe) – kafelek na Teraz ───────
  kid_gabi: !include { file: ../tiles/kid_plan.yaml, vars: { uid: kid_gabi, name: "Gabrysia", plan_calendar: calendar.dom_librus_gabriela_sobilo_plan_lekcji, extra_calendar: calendar.gabi_zajecia_dodatkowe } }
  kid_wik:  !include { file: ../tiles/kid_plan.yaml, vars: { uid: kid_wik,  name: "Wiktor",   plan_calendar: calendar.librus_wiktor_sobilo_plan_lekcji,         extra_calendar: calendar.wiktor_zajecia_dodatkowe } }

  # ── Pulpit 0: TERAZ – pokazują się tylko WŁĄCZONE (dotknięcie = wyłącz) ─────
  # Salon
  l_sn_glowne:  !include { file: ../tiles/active_light.yaml, vars: { uid: l_sn_glowne, name: "Salon",         icon: $ic_lightbulb, entity: switch.sn_oswietlenie_glowne, use_ha_name: "true" } }
  l_sn_sciana:  !include { file: ../tiles/active_light.yaml, vars: { uid: l_sn_sciana, name: "Salon ściana",  icon: $ic_lightbulb, entity: switch.sn_swiatlo_sciana, use_ha_name: "true" } }
  # Kuchnia
  l_kc_1:       !include { file: ../tiles/active_light.yaml, vars: { uid: l_kc_1, name: "Kuchnia meble", icon: $ic_lightbulb, entity: switch.kc_oswietlenie_l1, use_ha_name: "false" } }
  l_kc_2:       !include { file: ../tiles/active_light.yaml, vars: { uid: l_kc_2, name: "Kuchnia główne", icon: $ic_lightbulb, entity: switch.kc_oswietlenie_l2, use_ha_name: "false" } }
  # Sypialnia
  l_sp:         !include { file: ../tiles/active_light.yaml, vars: { uid: l_sp,     name: "Sypialnia",       icon: $ic_lightbulb, entity: light.sp_swiatlo, use_ha_name: "true" } }
  l_sp_lampka:  !include { file: ../tiles/active_light.yaml, vars: { uid: l_sp_lampka, name: "Lampka sypialnia", icon: $ic_lightbulb, entity: switch.sp_lampka_tasmota, use_ha_name: "true" } }
  # Pokój dzieci
  l_pd:         !include { file: ../tiles/active_light.yaml, vars: { uid: l_pd,     name: "Pokój dzieci",    icon: $ic_lightbulb, entity: switch.pd_oswietlenie, use_ha_name: "true" } }
  # Łazienka / toaleta / garderoba / pralnia
  l_lz_1:       !include { file: ../tiles/active_light.yaml, vars: { uid: l_lz_1, name: "Łazienka główne", icon: $ic_lightbulb, entity: light.lz_swiatlo_l1, use_ha_name: "false" } }
  l_lz_2:       !include { file: ../tiles/active_light.yaml, vars: { uid: l_lz_2, name: "Łazienka lustro", icon: $ic_lightbulb, entity: light.lz_swiatlo_l2, use_ha_name: "false" } }
  l_tl:         !include { file: ../tiles/active_light.yaml, vars: { uid: l_tl,   name: "Toaleta",    icon: $ic_lightbulb, entity: light.tl_oswietlenie, use_ha_name: "true" } }
  l_tl_lustro:  !include { file: ../tiles/active_light.yaml, vars: { uid: l_tl_lustro, name: "Lustro toaleta", icon: $ic_lightbulb, entity: light.tl_lustro, use_ha_name: "true" } }
  l_gb:         !include { file: ../tiles/active_light.yaml, vars: { uid: l_gb,   name: "Garderoba",  icon: $ic_lightbulb, entity: light.gb_swiatlo, use_ha_name: "true" } }
  l_pr:         !include { file: ../tiles/active_light.yaml, vars: { uid: l_pr,   name: "Pralnia",    icon: $ic_lightbulb, entity: light.pr_swiatlo, use_ha_name: "true" } }
  l_girlanda:   !include { file: ../tiles/active_light.yaml, vars: { uid: l_girlanda, name: "Girlanda", icon: $ic_string_lights, entity: switch.tasmota_tasmota2, use_ha_name: "true" } }
  # Telewizory / konsola (media_player: widoczny gdy nie jest off/standby)
  minecraft:    !include { file: ../tiles/game_server.yaml, vars: { uid: minecraft, name: "Minecraft", icon: $ic_minecraft, status_entity: binary_sensor.192_168_23_11_25565_status, players_entity: sensor.192_168_23_11_25565_players_online } }
  tv_salon:     !include { file: ../tiles/active.yaml, vars: { uid: tv_salon, name: "TV salon",     icon: $ic_television, entity: media_player.telewizor_2 } }   # SPRAWDŹ: telewizor / _2 / _3
  tv_sp:        !include { file: ../tiles/active.yaml, vars: { uid: tv_sp,    name: "TV sypialnia", icon: $ic_television, entity: media_player.living_room_ue40h6700 } }
  ps5:          !include { file: ../tiles/active.yaml, vars: { uid: ps5,      name: "PS5",          icon: $ic_gamepad,    entity: media_player.playstation_5 } }
  # Gniazdka wg poboru mocy [W]; dotknięcie wyłącza switch_entity ("" = nic nie robi)
  ekspres:  !include { file: ../tiles/active_power.yaml, vars: { uid: ekspres,  name: "Ekspres",     icon: $ic_coffee_maker,     entity: sensor.sn_ekspres_energy_power,  threshold: 5,  switch_entity: switch.sn_ekspres } }
  czajnik:  !include { file: ../tiles/active_power.yaml, vars: { uid: czajnik,  name: "Czajnik",     icon: $ic_kettle,           entity: sensor.czajnik_energy_power,     threshold: 50, switch_entity: switch.czajnik } }
  okap:     !include { file: ../tiles/active_power.yaml, vars: { uid: okap,     name: "Okap",        icon: $ic_fan,              entity: sensor.okap_energy_power,        threshold: 5,  switch_entity: switch.okap } }

  # Drukarka 3D (Bambu P1S) – kafelek TYLKO podczas druku, z godziną końca
  printer: !include
    file: ../tiles/printer.yaml
    vars:
      uid: printer
      name: "Drukarka 3D"
      status_entity: sensor.p1s_01p00a3a2600140_status_druku
      progress_entity: sensor.p1s_01p00a3a2600140_postep_drukowania
      end_entity: sensor.p1s_01p00a3a2600140_czas_zakonczenia
      printing_states: "running,prepare,pause,slicing,init"

