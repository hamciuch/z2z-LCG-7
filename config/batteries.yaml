# Baterie czujników – zbiorczy alert na Teraz, gdy któraś spadnie poniżej progu
# (domyślnie 25% = "1 kreska", czerwona). Dotknięcie pokazuje listę.
# Lista wygenerowana z HA (bez telefonów, auta i odkurzacza) – dopisuj kolejne wg wzoru.
