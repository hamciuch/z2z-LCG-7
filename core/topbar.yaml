# ─────────────────────────────────────────────────────────────────────────────
# Belka główna (zawsze na wierzchu): zegar, domownicy, temperatura na balkonie,
# deszcz, serwer, połączenie z HA/WiFi. Kropki nawigacji na dole.
# Dotknięcie zegara otwiera panel ustawień.
# ─────────────────────────────────────────────────────────────────────────────

lvgl:
  top_layer:
    widgets:
      - obj:
          id: topbar
          x: 0
          y: 0
          width: 800
          height: 60
          radius: 0
          bg_color: c_card
          bg_opa: COVER
          border_width: 0
          pad_all: 0
          scrollable: false
          widgets:
            - button:
                id: btn_clock
                x: 6
                align: LEFT_MID
                width: 250
                height: 56
                bg_opa: TRANSP
                shadow_width: 0
                pad_all: 0
                on_click:
                  - script.execute: settings_open
                widgets:
                  - label:
                      id: lbl_clock
                      x: 8
                      align: LEFT_MID
                      text_font: f40
                      text: "--:--"
                  - label:
                      id: lbl_date
                      x: 126
                      align: LEFT_MID
                      text_font: f18
                      text_color: c_muted
                      text: ""
            # temperatura na balkonie
            - label:
                id: ico_temp
                x: 540
                align: LEFT_MID
                text_font: i24
                text_color: c_muted
                text: $ic_thermometer
            - label:
                id: lbl_temp
                x: 566
                align: LEFT_MID
                text_font: f28
                text: "--°"
            # deszcz
            - label:
                id: ico_rain
                x: 664
                align: LEFT_MID
                text_font: i32
                text_color: c_muted
                text: $ic_cloud
            # serwer
            - label:
                id: ico_server
                x: 712
                align: LEFT_MID
                text_font: i32
                text_color: c_muted
                text: $ic_server
            # Home Assistant / WiFi
            - label:
                id: ico_ha
                x: 756
                align: LEFT_MID
                text_font: i32
                text_color: c_muted
                text: $ic_home_assistant

      # Dolny pasek nawigacji: ikona = pulpit (zamiast przewijania gestem)
      - obj:
          id: navbar
          align: BOTTOM_MID
          width: 800
          height: 56
          radius: 0
          bg_color: c_card
          bg_opa: COVER
          border_width: 0
          pad_all: 4
          scrollable: false
          layout:
            type: flex
            flex_flow: ROW
            flex_align_main: SPACE_EVENLY
            flex_align_cross: CENTER
          widgets:
            - button:
                id: nav0
                width: 104
                height: 48
                radius: 12
                bg_color: 0x3A2E10
                bg_opa: COVER
                shadow_width: 0
                pad_all: 0
                on_click:
                  - script.execute: { id: goto_page, idx: 0 }
                widgets:
                  - label: { align: TOP_MID, y: 2, text_font: i24, text_color: c_accent, text: $ic_home }
                  - label: { align: BOTTOM_MID, y: -1, text_font: f14, text_color: c_text, text: "Teraz" }
            - button:
