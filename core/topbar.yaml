sensor:
  # Serwer: działa, gdy pobór mocy z gniazdka > server_power_min [W]
  - platform: homeassistant
    id: ha_server
    entity_id: ${server_power_entity}
    on_value:
      - lambda: |-
          bool ok = !isnan(x) && x > ${server_power_min};
          lv_label_set_text(id(ico_server), ok ? "${ic_server}" : "${ic_server_off}");
          z2z::set_text_color(id(ico_server), ok ? z2z::C_OK : z2z::C_ERR);
      - if:
          condition:
            lambda: return isnan(x) || x <= ${server_power_min};
          then:
            - script.execute: wake_screen
  - platform: homeassistant
    id: ha_balcony_temp
    entity_id: ${balcony_temp_entity}
    on_value:
      - lvgl.label.update:
          id: lbl_temp
          text: !lambda return z2z::fmt(x, 1, "°");

text_sensor:
  - platform: homeassistant
    id: ha_rain
    entity_id: ${rain_entity}
    on_value:
      - lambda: |-
          bool rain = z2z::in_list(x, "${rain_states}");
          lv_label_set_text(id(ico_rain), rain ? "${ic_umbrella}" : "${ic_cloud}");
          z2z::set_text_color(id(ico_rain), rain ? 0x29B6F6 : z2z::C_MUTED);
script:
  - id: clock_refresh
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) t = id(sntp_time).now();
          if (!t.is_valid()) return;
          static const char *const DN[] = {"nd", "pn", "wt", "śr", "czw", "pt", "sob"};
          static const char *const MN[] = {"sty", "lut", "mar", "kwi", "maj", "cze",
                                           "lip", "sie", "wrz", "paź", "lis", "gru"};
          lv_label_set_text_fmt(id(lbl_clock), "%02d:%02d", t.hour, t.minute);
          lv_label_set_text_fmt(id(lbl_date), "%s, %d %s", DN[(t.day_of_week + 6) % 7], t.day_of_month, MN[(t.month + 11) % 12]);

  # Ikona HA: zielona = połączono, czerwona = brak API, przekreślone WiFi = brak sieci
  - id: status_refresh
    then:
      - lambda: |-
          if (!wifi::global_wifi_component->is_connected()) {
            lv_label_set_text(id(ico_ha), "${ic_wifi_off}");
            z2z::set_text_color(id(ico_ha), z2z::C_ERR);
          } else if (!api::global_api_server->is_connected()) {
            lv_label_set_text(id(ico_ha), "${ic_home_assistant}");
            z2z::set_text_color(id(ico_ha), z2z::C_ERR);
          } else {
            lv_label_set_text(id(ico_ha), "${ic_home_assistant}");
            z2z::set_text_color(id(ico_ha), id(fw_update).state == update::UPDATE_STATE_AVAILABLE ? z2z::C_ACCENT : z2z::C_OK);
          }

interval:
  - interval: 15s
    then:
      - script.execute: status_refresh
