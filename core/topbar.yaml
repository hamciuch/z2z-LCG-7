                  - label: { align: BOTTOM_MID, y: -1, text_font: f14, text_color: c_muted, text: "Ogrzewanie" }
            - button:
                id: nav3
                hidden: "${hide_page_car}"
                width: 104
                height: 48
                radius: 12
                bg_color: 0x3A2E10
                bg_opa: TRANSP
                shadow_width: 0
                pad_all: 0
                on_click:
                  - script.execute: { id: goto_page, idx: 3 }
                widgets:
                  - label: { align: TOP_MID, y: 2, text_font: i24, text_color: c_muted, text: $ic_car }
