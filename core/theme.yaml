  - id: c_water
    hex: "38BDF8"

lvgl:
  default_font: f18
  bottom_layer:
    bg_color: c_bg
    bg_opa: COVER
  theme:
    label:
      text_color: c_text
    button:
      bg_color: c_card2
      radius: 14
      shadow_width: 0
      text_color: c_text
      pressed:
        bg_color: c_accent
    bar:
      bg_color: c_card2
      radius: 6
      indicator:
        radius: 6
  style_definitions:
    # Obszar roboczy pulpitu: 800×480 – belka 60 px – dolny pasek nawigacji 56 px
    # = 780 × 350 px. Siatki: 5 kol. = 148 px, 4 kol. = 187 px, 3 kol. = 253 px,
    # 2 kol. = 385 px (odstęp 10 px). Wszystko ma się mieścić bez przewijania.
    - id: page_style
      bg_color: c_bg
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_top: 68
      pad_bottom: 62
      pad_left: 10
      pad_right: 10
    - id: tile_style            # aktywne urządzenie na pulpicie "Teraz" (5 kolumn)
      width: 148
      height: 108
      radius: 16
      bg_color: 0x16294A
      bg_opa: COVER
      border_width: 2
      border_color: c_accent
      pad_all: 10
      shadow_width: 0
    - id: alert_style           # alert – szerokość 2 kafelków
      width: 306
      height: 108
      radius: 16
      bg_color: 0x34200F
      bg_opa: COVER
      border_width: 2
      border_color: c_warn
      pad_all: 10
      shadow_width: 0
    - id: card_style            # karta na pozostałych pulpitach
      radius: 16
      bg_color: c_card
      bg_opa: COVER
      border_width: 0
      pad_all: 10
      shadow_width: 0
    - id: empty_style
      text_font: f22
      text_color: c_muted
      width: 100%
      text_align: center
