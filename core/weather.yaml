# ─────────────────────────────────────────────────────────────────────────────
# Ekran pogody: teraz (stacja na balkonie + czujnik deszczu) i prognoza 7 dni.
# Otwiera go dotknięcie pogody na belce. Prognozę panel pobiera z HA akcją
# weather.get_forecasts (${weather_entity}) przy otwarciu i co 30 min, gdy
# ekran jest widoczny – w HA nic nie trzeba konfigurować.
# ─────────────────────────────────────────────────────────────────────────────

text_sensor:
  - platform: homeassistant
    id: ha_weather
    entity_id: ${weather_entity}
    internal: true
    on_value:
      - lambda: |-
          lv_label_set_text(id(wn_ico), z2z::weather_glyph(x));
          lv_label_set_text(id(wn_cond), z2z::weather_text(x));
  - platform: homeassistant
    id: ha_rain_now
    entity_id: ${rain_entity}
    internal: true
    on_value:
      - lambda: |-
          bool rain = z2z::in_list(x, "${rain_states}");
          lv_label_set_text(id(wn_rain), rain ? "Pada deszcz" : "Nie pada");
          z2z::set_text_color(id(wn_rain), rain ? 0x38BDF8 : z2z::C_MUTED);

sensor:
  - platform: homeassistant
    id: ha_temp_now
    entity_id: ${balcony_temp_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: wn_temp
          text: !lambda return z2z::fmt(x, 1, "°");
  - platform: homeassistant
    id: ha_hum_now
    entity_id: ${humidity_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: wn_hum
          text: !lambda |-
            return isnan(x) ? std::string("") : "Wilgotność  " + z2z::fmt(x, 0, "%");
  - platform: homeassistant
    id: ha_press_now
    entity_id: ${pressure_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: wn_press
          text: !lambda |-
            return isnan(x) ? std::string("") : "Ciśnienie  " + z2z::fmt(x, 0, " hPa");

script:
  - id: weather_open
    then:
      - lvgl.page.show:
          id: page_weather
          animation: FADE_IN
          time: 200ms
      - script.execute: weather_fetch

  - id: weather_fetch
    mode: single
    then:
      - lvgl.label.update: { id: wn_upd, text: "Pobieram prognozę…" }
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${weather_entity}
            type: daily
          capture_response: true
          on_success:
            - lambda: |-
                // HA zwraca {"<encja>": {"forecast": [...]}} – sprawdzamy też inne spotykane układy
                JsonArrayConst f = response["${weather_entity}"]["forecast"].as<JsonArrayConst>();
                if (f.isNull()) f = response["response"]["${weather_entity}"]["forecast"].as<JsonArrayConst>();
                if (f.isNull()) f = response["forecast"].as<JsonArrayConst>();
                if (f.isNull()) {
                  for (JsonPairConst kv : response) {
                    JsonArrayConst a = kv.value()["forecast"].as<JsonArrayConst>();
                    if (!a.isNull()) { f = a; break; }
                  }
                }
                if (f.isNull() || f.size() == 0) {
                  std::string raw;
                  serializeJson(response, raw);
                  ESP_LOGW("pogoda", "Nieoczekiwana odpowiedź get_forecasts (%u B): %.400s", (unsigned) raw.size(), raw.c_str());
                }
                lv_obj_t *card[] = {id(wd0), id(wd1), id(wd2), id(wd3), id(wd4), id(wd5), id(wd6)};
                lv_obj_t *day[] = {id(wd0_day), id(wd1_day), id(wd2_day), id(wd3_day), id(wd4_day), id(wd5_day), id(wd6_day)};
                lv_obj_t *ico[] = {id(wd0_ico), id(wd1_ico), id(wd2_ico), id(wd3_ico), id(wd4_ico), id(wd5_ico), id(wd6_ico)};
                lv_obj_t *mx[] = {id(wd0_max), id(wd1_max), id(wd2_max), id(wd3_max), id(wd4_max), id(wd5_max), id(wd6_max)};
                lv_obj_t *mn[] = {id(wd0_min), id(wd1_min), id(wd2_min), id(wd3_min), id(wd4_min), id(wd5_min), id(wd6_min)};
                lv_obj_t *mm[] = {id(wd0_mm), id(wd1_mm), id(wd2_mm), id(wd3_mm), id(wd4_mm), id(wd5_mm), id(wd6_mm)};
                lv_obj_t *pp[] = {id(wd0_pp), id(wd1_pp), id(wd2_pp), id(wd3_pp), id(wd4_pp), id(wd5_pp), id(wd6_pp)};
                static const char *const DN[] = {"Nd", "Pn", "Wt", "Śr", "Czw", "Pt", "Sob"};
                auto now = id(ha_time).now();
                if (!now.is_valid()) now = id(sntp_time).now();
                size_t n = f.isNull() ? 0 : f.size();
                for (size_t i = 0; i < 7; i++) {
                  z2z::show(card[i], i < n);
                  if (i >= n) continue;
                  JsonObjectConst e = f[i];
                  struct tm t{};
                  if (z2z::iso_local(e["datetime"] | "", &t)) {
                    bool today = now.is_valid() && t.tm_mday == now.day_of_month && t.tm_mon + 1 == now.month;
                    if (today) lv_label_set_text(day[i], "Dziś");
                    else lv_label_set_text_fmt(day[i], "%s %d", DN[t.tm_wday], t.tm_mday);
                  } else {
                    lv_label_set_text(day[i], "");
                  }
                  lv_label_set_text(ico[i], z2z::weather_glyph(e["condition"] | ""));
                  float tx = e["temperature"] | NAN, tn = e["templow"] | NAN;
                  float pr = e["precipitation"] | NAN, pb = e["precipitation_probability"] | NAN;
                  lv_label_set_text(mx[i], z2z::fmt(tx, 0, "°").c_str());
                  lv_label_set_text(mn[i], isnan(tn) ? "" : z2z::fmt(tn, 0, "°").c_str());
                  lv_label_set_text(mm[i], (isnan(pr) || pr <= 0) ? "" : z2z::fmt(pr, 1, " mm").c_str());
                  lv_label_set_text(pp[i], isnan(pb) ? "" : z2z::fmt(pb, 0, "%").c_str());
                }
                if (n == 0) lv_label_set_text(id(wn_upd), "Brak prognozy z HA (szczegóły w logach)");
                else if (now.is_valid()) lv_label_set_text_fmt(id(wn_upd), "Prognoza z %02d:%02d", now.hour, now.minute);
                else lv_label_set_text(id(wn_upd), "");
          on_error:
            - lvgl.label.update:
                id: wn_upd
                text: !lambda |-
                  return "Nie udało się pobrać prognozy: " + error;

interval:
  - interval: 30min
    then:
      - if:
          condition:
            lambda: return id(page_weather)->is_showing();
          then:
            - script.execute: weather_fetch

lvgl:
  pages:
    - id: !extend page_weather
      widgets:
        # Teraz
        - obj:
            width: 780
            height: 110
            radius: 16
            bg_color: c_card
            border_width: 0
            pad_all: 10
            scrollable: false
            widgets:
              - label: { id: wn_ico, x: 6, align: LEFT_MID, text_font: i48, text_color: c_accent, text: "" }
              - label: { id: wn_temp, x: 70, y: -2, align: TOP_LEFT, text_font: f40, text: "--°" }
              - label: { id: wn_cond, x: 72, align: BOTTOM_LEFT, width: 220, long_mode: DOT, text_font: f18, text_color: c_muted, text: "" }
              - label: { id: wn_hum, x: 310, y: 6, align: TOP_LEFT, text_font: f18, text: "" }
              - label: { id: wn_press, x: 310, y: 36, align: TOP_LEFT, text_font: f18, text: "" }
              - label: { id: wn_rain, x: 310, align: BOTTOM_LEFT, text_font: f18, text_color: c_muted, text: "" }
              - label: { id: wn_upd, align: BOTTOM_RIGHT, width: 230, long_mode: DOT, text_align: RIGHT, text_font: f14, text_color: c_muted, text: "" }
