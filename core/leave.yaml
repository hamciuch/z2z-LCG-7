# Przycisk "Wychodzę" na pulpicie Teraz (zawsze ostatni kafelek).
# Wyłącza WYŁĄCZNIE encje z listy leave_entities w config/home.yaml (światła,
# ekspres, czajnik, okap, TV, PS5). Pralka, suszarka, serwer, drukarka 3D
# i komputery celowo NIE są na liście – nie dopisuj ich tam.
lvgl:
  pages:
    - id: !extend page_home
      widgets:
        - button:
            id: leave_btn
            width: 148
            height: 108
            radius: 16
            bg_color: c_card
            border_width: 1
            border_color: 0x2A3142
            pad_all: 10
            shadow_width: 0
            on_click:
              - script.execute:
                  id: confirm_open
                  q: "Wychodzę – wyłączyć?"
                  sub: "${leave_desc}"
                  yes: "Wyłącz"
                  action: "homeassistant.turn_off"
                  entity: "${leave_entities}"
            widgets:
              - label:
                  align: TOP_LEFT
                  text_font: i32
                  text_color: c_accent
                  text: $ic_exit_run
              - label:
                  align: BOTTOM_LEFT
                  y: -20
                  text_font: f16
                  text: "Wychodzę"
              - label:
                  align: BOTTOM_LEFT
                  text_font: f14
                  text_color: c_muted
                  text: "światła i AGD"
