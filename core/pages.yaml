# ─────────────────────────────────────────────────────────────────────────────
# Pulpity (strony LVGL), nawigacja dolnym paskiem ikon, wygaszanie ekranu.
#   0 Teraz · 1 Światła · 2 Gniazdka · 3 Ogrzewanie · 4 Auto · 5 Odkurzacz · 6 AGD · 7 Rośliny · 8 Szkoła
#   (+ Pogoda i Paczki: bez ikony na dole, otwierane z belki)
# Kafelki z tiles/*.yaml dopisują się do stron przez `!extend page_xxx`.
# Numery pulpitów używa "goto" w alertach i akcja API show_page.
# ─────────────────────────────────────────────────────────────────────────────

lvgl:
  id: lvgl_main
  # 100% = bufor w PSRAM (przy <=25% ESPHome bierze wewnętrzny RAM i brakuje go dla WiFi/mDNS)
  buffer_size: 100%
  page_wrap: true
  resume_on_input: true
  log_level: WARN

  on_idle:
    # Powrót na pulpit główny po bezczynności
    - timeout: !lambda |-
        float s = id(home_return_s).state;
        return (uint32_t) ((isnan(s) || s <= 0) ? 86400000 : s * 1000);
      then:
        - if:
            condition:
              lambda: return !id(page_home)->is_showing();
            then:
              - lvgl.page.show:
                  id: page_home
                  animation: FADE_IN
                  time: 200ms
    # Wygaszenie ekranu (brak dotyku i brak ruchu z czujników)
    - timeout: !lambda |-
        float m = id(screen_timeout_min).state;
        return (uint32_t) ((isnan(m) || m <= 0) ? 86400000 : m * 60000);
      then:
        - if:
            condition:
              lambda: return id(screen_timeout_min).state > 0;
            then:
              - light.turn_off: backlight
              - lvgl.pause:

  on_resume:
    - light.turn_on: backlight

  pages:
    - id: page_home
      styles: page_style
      scroll_dir: VER
      layout: &flex
        type: flex
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        flex_align_track: START
        pad_row: 10
        pad_column: 10
      on_load:
        - script.execute: { id: dots_set, idx: 0 }
      widgets:
        - label:
            id: home_empty
            styles: empty_style
            text: "Wszystko wyłączone, nic nie wymaga uwagi"

    - id: page_lights
      skip: ${hide_page_lights}
      styles: page_style
      scroll_dir: VER
      layout: *flex
      on_load:
        - script.execute: { id: dots_set, idx: 1 }

    - id: page_sockets
      skip: ${hide_page_sockets}
      styles: page_style
      scroll_dir: VER
      layout: *flex
      on_load:
        - script.execute: { id: dots_set, idx: 2 }

    - id: page_heating
      skip: ${hide_page_heating}
      styles: page_style
      scroll_dir: VER
      layout: *flex
      on_load:
        - script.execute: { id: dots_set, idx: 3 }

    - id: page_car
      skip: ${hide_page_car}
      styles: page_style
      scroll_dir: VER
      layout: *flex
      on_load:
        - script.execute: { id: dots_set, idx: 4 }

    - id: page_vacuum
      skip: ${hide_page_vacuum}
      styles: page_style
      scroll_dir: VER
      layout: *flex
      on_load:
        - script.execute: { id: dots_set, idx: 5 }

    - id: page_appliances
      skip: ${hide_page_appliances}
      styles: page_style
      scroll_dir: VER
      layout: *flex
      on_load:
        - script.execute: { id: dots_set, idx: 6 }

    - id: page_plants
      skip: ${hide_page_plants}
      styles: page_style
      scroll_dir: VER
      layout: *flex
      on_load:
        - script.execute: { id: dots_set, idx: 7 }

    - id: page_school
      skip: ${hide_page_school}
      styles: page_style
      scroll_dir: NONE
      scrollable: false
      layout: *flex
      on_load:
        - script.execute: { id: dots_set, idx: 8 }

    # Pogoda – poza dolnym paskiem, otwiera ją dotknięcie pogody na belce (core/weather.yaml)
    - id: page_weather
      skip: true
      styles: page_style
      scroll_dir: NONE
      scrollable: false
      layout: *flex
      on_load:
        - script.execute: { id: dots_set, idx: -1 }

    # Paczki InPost – poza dolnym paskiem, otwiera je dotknięcie ikony paczki na belce (core/parcels.yaml)
    - id: page_parcels
      skip: true
      styles: page_style
      scroll_dir: NONE
      scrollable: false
      layout: *flex
      on_load:
        - script.execute: { id: dots_set, idx: -1 }

script:
  # Pokazuje / chowa napis "wszystko wyłączone" na pulpicie głównym
  - id: home_refresh
    mode: restart
    then:
      - delay: 50ms
      - lambda: |-
          lv_obj_t *page = id(page_home)->obj;
          int n = z2z::visible_children(page, id(home_empty), id(leave_btn));
          z2z::show(id(home_empty), n == 0);

  # Wybudza ekran i zeruje licznik bezczynności (nowy alert, ruch z czujnika)
  - id: wake_screen
    mode: restart
    then:
      - lambda: lv_display_trigger_activity(id(lvgl_main)->get_disp());
      - if:
          condition:
            lvgl.is_paused:
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - light.turn_on: backlight

  # Dolny pasek: podświetla ikonę aktywnego pulpitu
  - id: dots_set
    parameters:
      idx: int
    then:
      - lambda: |-
          lv_obj_t *n[] = {id(nav0), id(nav1), id(nav2), id(nav3), id(nav4), id(nav5), id(nav6), id(nav7), id(nav8)};
          for (int i = 0; i < 9; i++) {
            bool on = i == idx;
            lv_obj_set_style_bg_opa(n[i], on ? LV_OPA_COVER : LV_OPA_TRANSP, 0);
            lv_obj_t *ico = lv_obj_get_child(n[i], 0), *txt = lv_obj_get_child(n[i], 1);
            z2z::set_text_color(ico, on ? z2z::C_ACCENT : z2z::C_MUTED);
            z2z::set_text_color(txt, on ? z2z::C_TEXT : z2z::C_MUTED);
          }

  # Przejście do pulpitu po numerze (alerty, akcja API "show_page")
  - id: goto_page
    parameters:
      idx: int
    then:
      - lambda: |-
          if (idx >= 0 && idx < 9) id(lvgl_main)->show_page(idx, LV_SCREEN_LOAD_ANIM_FADE_IN, 200);
