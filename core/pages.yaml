# ─────────────────────────────────────────────────────────────────────────────
# Pulpity (strony LVGL), przewijanie gestem z animacją, wygaszanie ekranu.
#   0 Teraz (dynamiczny) · 1 Ogrzewanie · 2 Samochód · 3 Odkurzacz
#   4 Zmywarka · 5 Rośliny
# Kafelki z tiles/*.yaml dopisują się do stron przez `!extend page_xxx`.
# ─────────────────────────────────────────────────────────────────────────────

lvgl:
  id: lvgl_main
  # 100% = bufor w PSRAM (przy <=25% ESPHome bierze wewnętrzny RAM i brakuje go dla WiFi/mDNS)
  buffer_size: 100%
  page_wrap: true
  resume_on_input: true
  log_level: WARN

  on_idle:
    # Powrót na pulpit główny po bezczynności
    - timeout: !lambda |-
        float s = id(home_return_s).state;
        return (uint32_t) ((isnan(s) || s <= 0) ? 86400000 : s * 1000);
      then:
        - if:
            condition:
              lambda: return !id(page_home)->is_showing();
            then:
              - lvgl.page.show:
                  id: page_home
                  animation: FADE_IN
                  time: 300ms
    # Wygaszenie ekranu
    - timeout: !lambda |-
        float m = id(screen_timeout_min).state;
        return (uint32_t) ((isnan(m) || m <= 0) ? 86400000 : m * 60000);
      then:
        - if:
            condition:
              lambda: return id(screen_timeout_min).state > 0;
            then:
              - light.turn_off: backlight
              - lvgl.pause:

  on_resume:
    - light.turn_on: backlight

  pages:
    - id: page_home
      styles: page_style
      scroll_dir: VER
      layout:
        type: flex
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        flex_align_track: START
        pad_row: 14
        pad_column: 14
      on_swipe_left: &swipe_left
        - lambda: lv_indev_wait_release(lv_indev_active());
        - lvgl.page.next:
            animation: MOVE_LEFT
            time: 300ms
      on_swipe_right: &swipe_right
        - lambda: lv_indev_wait_release(lv_indev_active());
        - lvgl.page.previous:
            animation: MOVE_RIGHT
            time: 300ms
      on_load:
        - script.execute: { id: dots_set, idx: 0 }
      widgets:
        - label:
            id: home_empty
            styles: empty_style
            text: "Wszystko wyłączone, nic nie wymaga uwagi"

    - id: page_heating
      skip: ${hide_page_heating}
      styles: page_style
      scroll_dir: VER
      layout: &flex
        type: flex
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        flex_align_track: START
        pad_row: 14
        pad_column: 14
      on_swipe_left: *swipe_left
      on_swipe_right: *swipe_right
      on_load:
        - script.execute: { id: dots_set, idx: 1 }
      widgets:
        - label: { styles: title_style, text: "Ogrzewanie" }

    - id: page_car
      skip: ${hide_page_car}
      styles: page_style
      scroll_dir: VER
      layout: *flex
      on_swipe_left: *swipe_left
      on_swipe_right: *swipe_right
      on_load:
        - script.execute: { id: dots_set, idx: 2 }
      widgets:
        - label: { styles: title_style, text: "Samochód" }

    - id: page_vacuum
      skip: ${hide_page_vacuum}
      styles: page_style
      scroll_dir: VER
      layout: *flex
      on_swipe_left: *swipe_left
      on_swipe_right: *swipe_right
      on_load:
        - script.execute: { id: dots_set, idx: 3 }
      widgets:
        - label: { styles: title_style, text: "Odkurzacz" }

    - id: page_dishwasher
      skip: ${hide_page_dishwasher}
      styles: page_style
      scroll_dir: VER
      layout: *flex
      on_swipe_left: *swipe_left
      on_swipe_right: *swipe_right
      on_load:
        - script.execute: { id: dots_set, idx: 4 }
      widgets:
        - label: { styles: title_style, text: "Zmywarka" }

    - id: page_plants
      skip: ${hide_page_plants}
      styles: page_style
      scroll_dir: VER
      layout: *flex
      on_swipe_left: *swipe_left
      on_swipe_right: *swipe_right
      on_load:
        - script.execute: { id: dots_set, idx: 5 }
      widgets:
        - label: { styles: title_style, text: "Rośliny" }

script:
  # Pokazuje / chowa napis "wszystko wyłączone" na pulpicie głównym
  - id: home_refresh
    mode: restart
    then:
      - delay: 50ms
      - lambda: |-
          lv_obj_t *page = id(page_home)->obj;
          int n = z2z::visible_children(page, id(home_empty), nullptr);
          z2z::show(id(home_empty), n == 0);

  # Wybudza ekran (np. gdy pojawia się nowy alert)
  - id: wake_screen
    mode: restart
    then:
      - if:
          condition:
            lvgl.is_paused:
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - light.turn_on: backlight

  # Kropki nawigacji
  - id: dots_set
    parameters:
      idx: int
    then:
      - lambda: |-
          lv_obj_t *d[] = {id(dot0), id(dot1), id(dot2), id(dot3), id(dot4), id(dot5)};
          for (int i = 0; i < 6; i++)
            z2z::set_bg(d[i], i == idx ? z2z::C_ACCENT : z2z::C_DOT_OFF);

  # Przejście do strony po numerze (akcja API "show_page")
  - id: goto_page
    parameters:
      idx: int
    then:
      - if:
          condition: { lambda: return idx == 0; }
          then: [{ lvgl.page.show: { id: page_home, animation: FADE_IN, time: 200ms } }]
      - if:
          condition: { lambda: return idx == 1; }
          then: [{ lvgl.page.show: { id: page_heating, animation: FADE_IN, time: 200ms } }]
      - if:
          condition: { lambda: return idx == 2; }
          then: [{ lvgl.page.show: { id: page_car, animation: FADE_IN, time: 200ms } }]
      - if:
          condition: { lambda: return idx == 3; }
          then: [{ lvgl.page.show: { id: page_vacuum, animation: FADE_IN, time: 200ms } }]
      - if:
          condition: { lambda: return idx == 4; }
          then: [{ lvgl.page.show: { id: page_dishwasher, animation: FADE_IN, time: 200ms } }]
      - if:
          condition: { lambda: return idx == 5; }
          then: [{ lvgl.page.show: { id: page_plants, animation: FADE_IN, time: 200ms } }]
