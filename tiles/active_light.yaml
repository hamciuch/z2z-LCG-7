# Kafelek "aktywne światło" na pulpicie głównym.
# Widoczny tylko gdy encja jest włączona (light, switch, input_boolean, fan,
# media_player…). Dotknięcie = wyłącz.
# vars: uid, entity, name, icon
# Wariant dla świateł: nazwa = opis (friendly_name) z HA, "name" to zapas.
text_sensor:
  - platform: homeassistant
    id: ${uid}_st
    entity_id: ${entity}
    internal: true
    on_value:
      - lambda: |-
          z2z::set_visible(id(${uid}_tile), z2z::is_active(x));
          lv_label_set_text(id(${uid}_sub), z2z::pl(x).c_str());
      - script.execute: home_refresh

  - platform: homeassistant
    id: ${uid}_fn
    entity_id: ${entity}
    attribute: friendly_name
    internal: true
    on_value:
      - lambda: |-
          if (!x.empty()) lv_label_set_text(id(${uid}_nm), x.c_str());

lvgl:
  pages:
    - id: !extend page_home
      widgets:
        - button:
            id: ${uid}_tile
            styles: tile_style
            hidden: true
            on_click:
              - homeassistant.action:
                  action: homeassistant.turn_off
                  data:
                    entity_id: ${entity}
            widgets:
              - label:
                  align: TOP_LEFT
                  text_font: i32
                  text_color: c_accent
                  text: "${icon}"
              - label:
                  id: ${uid}_nm
                  align: BOTTOM_LEFT
                  y: -20
                  width: 126
                  long_mode: DOT
                  height: 24
                  text_font: f16
                  text: "${name}"
              - label:
                  id: ${uid}_sub
                  align: BOTTOM_LEFT
                  width: 126
                  long_mode: DOT
                  height: 22
                  text_font: f14
                  text_color: c_muted
                  text: ""
