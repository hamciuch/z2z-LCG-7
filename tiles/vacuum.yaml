# Odkurzacz: stan, bateria, przyciski Start / Pauza / Do stacji.
# Błąd odkurzacza automatycznie pokazuje alert na pulpicie głównym.
# vars: uid, entity (vacuum.*), name, battery_entity (sensor %)
text_sensor:
  - platform: homeassistant
    id: ${uid}_st
    entity_id: ${entity}
    internal: true
    on_value:
      - lambda: |-
          bool err = x == "error";
          bool cleaning = x == "cleaning" || x == "returning";
          lv_label_set_text(id(${uid}_state), z2z::pl(x).c_str());
          z2z::set_text_color(id(${uid}_icon), err ? z2z::C_ERR : (cleaning ? z2z::C_ACCENT : z2z::C_MUTED));
          if (z2z::set_visible(id(${uid}_alert), err)) id(wake_screen).execute();
      - script.execute: home_refresh

sensor:
  - platform: homeassistant
    id: ${uid}_bat
    entity_id: ${battery_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: ${uid}_bat_lbl
          text: !lambda return z2z::fmt(x, 0, "%");

lvgl:
  pages:
    - id: !extend page_vacuum
      widgets:
        - obj:
            styles: card_style
            width: 100%
            height: 250
            scrollable: false
            widgets:
              - label:
                  id: ${uid}_icon
                  align: TOP_LEFT
                  x: 6
                  y: 6
                  text_font: i48
                  text_color: c_muted
                  text: $ic_robot_vacuum
              - label:
                  align: TOP_LEFT
                  x: 80
                  y: 6
                  text_font: f22
                  text_color: c_muted
                  text: "${name}"
              - label:
                  id: ${uid}_state
                  align: TOP_LEFT
                  x: 80
                  y: 36
                  text_font: f40
                  text: "--"
              - label:
                  align: TOP_RIGHT
                  x: -70
                  y: 14
                  text_font: i32
                  text_color: c_ok
                  text: $ic_battery
              - label:
                  id: ${uid}_bat_lbl
                  align: TOP_RIGHT
                  y: 14
                  text_font: f28
                  text: "--%"
              - button:
                  align: BOTTOM_LEFT
                  width: 230
                  height: 80
                  on_click:
                    - homeassistant.action:
                        action: vacuum.start
                        data: { entity_id: "${entity}" }
                  widgets:
                    - label: { align: CENTER, text_font: f22, text: "Start" }
              - button:
                  align: BOTTOM_MID
                  width: 230
                  height: 80
                  on_click:
                    - homeassistant.action:
                        action: vacuum.pause
                        data: { entity_id: "${entity}" }
                  widgets:
                    - label: { align: CENTER, text_font: f22, text: "Pauza" }
              - button:
                  align: BOTTOM_RIGHT
                  width: 230
                  height: 80
                  on_click:
                    - homeassistant.action:
                        action: vacuum.return_to_base
                        data: { entity_id: "${entity}" }
                  widgets:
                    - label: { align: CENTER, text_font: f22, text: "Do stacji" }

    - id: !extend page_home
      widgets:
        - button:
            id: ${uid}_alert
            styles: alert_style
            hidden: true
            on_click:
              - script.execute: { id: goto_page, idx: 3 }
            widgets:
              - label:
                  align: LEFT_MID
                  text_font: i48
                  text_color: c_err
                  text: $ic_robot_vacuum
              - label:
                  align: TOP_LEFT
                  x: 64
                  width: 270
                  long_mode: WRAP
                  text_font: f22
                  text: "${name}: błąd – sprawdź odkurzacz"
