# Odkurzacz (integracja Tasshack/dreame-vacuum) – część 1/3: STATUS.
# Kolejność w config/home.yaml:  vacuum.yaml → vacuum_room.yaml (×N) → vacuum_controls.yaml
#
# Pokazuje: stan, szczegółowy status, baterię, bieżące pomieszczenie, powierzchnię.
# Na pulpicie "Teraz": kafelek gdy sprząta (dotknij → pulpit odkurzacza) i alert przy błędzie.
# vars: name, prefix (np. x40_ultra_complete – początek entity_id odkurzacza)
globals:
  - id: vac_sel                 # wybrane pomieszczenia (segment id) w kolejności klikania
    type: std::vector<int>
  - id: vac_repeats
    type: int
    initial_value: "1"

text_sensor:
  - platform: homeassistant
    id: vac_state
    entity_id: vacuum.${prefix}
    internal: true
    on_value:
      - lambda: |-
          bool err = x == "error";
          bool busy = x == "cleaning" || x == "returning";
          lv_label_set_text(id(vac_state_lbl), z2z::pl(x).c_str());
          z2z::set_text_color(id(vac_icon), err ? z2z::C_ERR : (busy ? z2z::C_ACCENT : z2z::C_MUTED));
          z2z::set_visible(id(vac_home_tile), busy);
          lv_label_set_text(id(vac_home_sub), z2z::pl(x).c_str());
          if (z2z::set_visible(id(vac_alert), err)) id(wake_screen).execute();
      - script.execute: vac_buttons_refresh
      - script.execute: home_refresh

  - platform: homeassistant
    id: vac_status
    entity_id: sensor.${prefix}_state
    internal: true
    on_value:
      - lvgl.label.update:
          id: vac_status_lbl
          text: !lambda return z2z::pl(x);

  - platform: homeassistant
    id: vac_room_now
    entity_id: sensor.${prefix}_current_room
    internal: true
    on_value:
      - lambda: |-
          bool ok = !(x == "unavailable" || x == "unknown" || x.empty());
          std::string r = z2z::kv("${vac_room_names}", x);
          if (r.empty()) r = x;
          lv_label_set_text(id(vac_room_lbl), ok ? r.c_str() : "");
          if (ok) lv_label_set_text(id(vac_home_sub), r.c_str());

sensor:
  - platform: homeassistant
    id: vac_battery
    entity_id: sensor.${prefix}_battery_level
    internal: true
    on_value:
      - lvgl.label.update:
          id: vac_bat_lbl
          text: !lambda return z2z::fmt(x, 0, "%");
  - platform: homeassistant
    id: vac_area
    entity_id: sensor.${prefix}_cleaned_area
    internal: true
    on_value:
      - lvgl.label.update:
          id: vac_area_lbl
          text: !lambda |-
            return isnan(x) ? std::string("") : z2z::fmt(x, 0, " m²");

lvgl:
  pages:
    - id: !extend page_vacuum
      widgets:
        - obj:
            styles: card_style
            width: 100%
            height: 60
            pad_all: 6
            scrollable: false
            widgets:
              - label:
                  id: vac_icon
                  align: LEFT_MID
                  x: 4
                  text_font: i32
                  text_color: c_muted
                  text: $ic_robot_vacuum
              - label:
                  id: vac_state_lbl
                  align: TOP_LEFT
                  x: 48
                  text_font: f18
                  text: "--"
              - label:
                  id: vac_status_lbl
                  align: BOTTOM_LEFT
                  x: 48
                  text_font: f14
                  text_color: c_muted
                  text: ""
              - label:
                  id: vac_room_lbl
                  align: TOP_LEFT
                  x: 330
                  text_font: f18
                  text_color: c_accent
                  text: ""
              - label:
                  id: vac_area_lbl
                  align: BOTTOM_LEFT
                  x: 330
                  text_font: f14
                  text_color: c_muted
                  text: ""
              - label:
                  align: RIGHT_MID
                  x: -62
                  text_font: i24
                  text_color: c_ok
                  text: $ic_battery
              - label:
                  id: vac_bat_lbl
                  align: RIGHT_MID
                  text_font: f22
                  text: "--%"

    - id: !extend page_home
      widgets:
        - button:
            id: vac_home_tile
            styles: tile_style
            hidden: true
            on_click:
              - script.execute: { id: goto_page, idx: 5 }
            widgets:
              - label:
                  align: TOP_LEFT
                  text_font: i32
                  text_color: c_accent
                  text: $ic_robot_vacuum
              - label:
                  align: BOTTOM_LEFT
                  y: -20
                  width: 150
                  long_mode: DOT
                  text_font: f22
                  text: "${name}"
              - label:
                  id: vac_home_sub
                  align: BOTTOM_LEFT
                  width: 150
                  long_mode: DOT
                  height: 22
                  text_font: f14
                  text_color: c_muted
                  text: ""
        - button:
            id: vac_alert
            styles: alert_style
            hidden: true
            on_click:
              - script.execute: { id: goto_page, idx: 5 }
            widgets:
              - label:
                  align: LEFT_MID
                  text_font: i32
                  text_color: c_err
                  text: $ic_robot_vacuum
              - label:
                  align: TOP_LEFT
                  x: 58
                  width: 222
                  long_mode: WRAP
                  text_font: f18
                  text: "${name}: błąd – sprawdź odkurzacz"
