# Czujnik zalania: czerwony alert na Teraz TYLKO gdy wykryje wodę; budzi ekran.
# vars: uid, name, entity (binary_sensor moisture, on = woda)
text_sensor:
  - platform: homeassistant
    id: ${uid}_s
    entity_id: ${entity}
    internal: true
    on_value:
      - lambda: |-
          if (z2z::set_visible(id(${uid}_tile), x == "on")) id(wake_screen).execute();
      - script.execute: home_refresh

lvgl:
  pages:
    - id: !extend page_home
      widgets:
        - button:
            id: ${uid}_tile
            styles: alert_style
            hidden: true
            bg_color: 0x3A1414
            border_color: c_err
            widgets:
              - label: { align: LEFT_MID, text_font: i32, text_color: c_err, text: $ic_water_alert }
              - label: { align: TOP_LEFT, x: 58, width: 222, long_mode: WRAP, text_font: f18, text: "ZALANIE!" }
              - label: { align: BOTTOM_LEFT, x: 58, width: 222, long_mode: DOT, text_font: f18, text_color: 0xFFB4B4, text: "${name}" }
