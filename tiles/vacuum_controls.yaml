# Odkurzacz – część 3/3: STEROWANIE + okno OPCJI.
# Na pulpicie: podsumowanie opcji (dotknij → okno opcji) i przyciski
#   Sprzątaj wybrane / Pauza / Wznów / Stop / Do stacji.
# W oknie opcji: CleanGenius, tryb, moc ssania, wilgotność mopa, liczba przejść,
#   Umyj mop / Susz mop / Mapowanie (z potwierdzeniem).
# Opcje ustawiają selecty integracji Dreame w HA (to samo co w aplikacji).
# "Sprzątaj wybrane" → dreame_vacuum.vacuum_clean_segment – nigdy całe mieszkanie.
# vars: prefix

text_sensor:
  - platform: homeassistant
    id: vac_cg_st
    entity_id: select.${prefix}_cleangenius
    internal: true
    on_value:
      - lambda: |-
          lv_obj_t *const b[] = {id(vac_cg_0), id(vac_cg_1), id(vac_cg_2)};
          static const char *const o[] = {"off", "routine_cleaning", "deep_cleaning"};
          z2z::mark_row(id(vac_cg_row), b, o, 3, x);
          bool cg = x != "off" && x != "unavailable" && x != "unknown";
          z2z::show(id(vac_cg_hint), cg);
      - script.execute: vac_summary
  - platform: homeassistant
    id: vac_mode_st
    entity_id: select.${prefix}_cleaning_mode
    internal: true
    on_value:
      - lambda: |-
          lv_obj_t *const b[] = {id(vac_mode_0), id(vac_mode_1), id(vac_mode_2), id(vac_mode_3)};
          static const char *const o[] = {"sweeping", "mopping", "sweeping_and_mopping", "mopping_after_sweeping"};
          z2z::mark_row(id(vac_mode_row), b, o, 4, x);
      - script.execute: vac_summary
  - platform: homeassistant
    id: vac_suc_st
    entity_id: select.${prefix}_suction_level
    internal: true
    on_value:
      - lambda: |-
          lv_obj_t *const b[] = {id(vac_suc_0), id(vac_suc_1), id(vac_suc_2), id(vac_suc_3)};
          static const char *const o[] = {"quiet", "standard", "strong", "turbo"};
          z2z::mark_row(id(vac_suc_row), b, o, 4, x);
      - script.execute: vac_summary
  - platform: homeassistant
    id: vac_mop_st
    entity_id: select.${prefix}_mop_pad_humidity
    internal: true
    on_value:
      - lambda: |-
          lv_obj_t *const b[] = {id(vac_mop_0), id(vac_mop_1), id(vac_mop_2)};
          static const char *const o[] = {"slightly_dry", "moist", "wet"};
          z2z::mark_row(id(vac_mop_row), b, o, 3, x);
      - script.execute: vac_summary

lvgl:
