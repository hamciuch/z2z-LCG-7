                  id: vac_opts_lbl
                  align: LEFT_MID
                  x: 34
                  width: 640
                  long_mode: DOT
                  text_font: f18
                  text: "Opcje sprzątania"
              - label:
                  align: RIGHT_MID
                  text_font: f18
                  text_color: c_muted
                  text: "zmień ›"
        - obj:
            width: 100%
            height: 60
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: ROW
              flex_align_cross: CENTER
              pad_column: 8
            widgets:
              - button:
                  id: vac_start
                  width: 300
                  height: 60
                  radius: 14
                  bg_color: c_accent
                  on_click:
                    - if:
                        condition:
                          lambda: return !id(vac_sel).empty();
                        then:
                          - homeassistant.action:
                              action: dreame_vacuum.vacuum_clean_segment
                              data:
                                entity_id: vacuum.${prefix}
                              data_template:
                                segments: "{{ segs }}"
                                repeats: "{{ rep }}"
                              variables:
                                segs: !lambda |-
                                  std::string s = "[";
                                  for (size_t i = 0; i < id(vac_sel).size(); i++) {
                                    if (i) s += ",";
                                    s += std::to_string(id(vac_sel)[i]);
                                  }
                                  return s + "]";
                                rep: !lambda return std::to_string(id(vac_repeats));
                          - script.execute: vac_clear_selection
                  widgets:
                    - label: { id: vac_start_lbl, align: CENTER, text_font: f18, text_align: CENTER, text: "Sprzątaj wybrane", text_color: 0x000000 }
              - button:
                  id: vac_pause
                  width: 110
                  height: 60
                  radius: 14
                  on_click:
                    - homeassistant.action:
                        action: vacuum.pause
                        data:
                          entity_id: vacuum.${prefix}
                  widgets:
                    - label: { id: vac_pause_lbl, align: CENTER, text_font: f18, text_align: CENTER, text: "Pauza" }
              - button:
                  id: vac_resume
                  width: 110
                  height: 60
                  radius: 14
                  on_click:
                    - homeassistant.action:
                        action: vacuum.start
                        data:
                          entity_id: vacuum.${prefix}
                  widgets:
                    - label: { id: vac_resume_lbl, align: CENTER, text_font: f18, text_align: CENTER, text: "Wznów" }
              - button:
                  id: vac_stop
                  width: 110
                  height: 60
                  radius: 14
                  on_click:
                    - homeassistant.action:
                        action: vacuum.stop
                        data:
                          entity_id: vacuum.${prefix}
                  widgets:
                    - label: { id: vac_stop_lbl, align: CENTER, text_font: f18, text_align: CENTER, text: "Stop" }
              - button:
                  id: vac_dock
                  width: 110
                  height: 60
                  radius: 14
                  on_click:
                    - homeassistant.action:
                        action: vacuum.return_to_base
                        data:
                          entity_id: vacuum.${prefix}
                  widgets:
                    - label: { id: vac_dock_lbl, align: CENTER, text_font: f18, text_align: CENTER, text: "Do stacji" }

