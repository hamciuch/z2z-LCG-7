script:
  - id: vac_clear_selection
    then:
      - lambda: |-
          lv_obj_t *page = id(page_vacuum)->obj;
          uint32_t n = lv_obj_get_child_count(page);
          for (uint32_t i = 0; i < n; i++) {
            lv_obj_t *c = lv_obj_get_child(page, i);
            if (lv_obj_has_flag(c, LV_OBJ_FLAG_CHECKABLE)) lv_obj_remove_state(c, LV_STATE_CHECKED);
          }
          id(vac_sel).clear();
      - script.execute: vac_buttons_refresh

  # Podsumowanie opcji na pulpicie, np. "Odk. + mop · Standard · mop: Wilgotny · 1×"
  - id: vac_summary
    mode: restart
    then:
      - lambda: |-
          auto lbl = [](const std::string &v, const char *const *k, const char *const *l, int n) -> std::string {
            for (int i = 0; i < n; i++) if (v == k[i]) return l[i];
            return "?";
          };
          static const char *const K_cg[] = {"off", "routine_cleaning", "deep_cleaning"};
          static const char *const L_cg[] = {"Wyłączone", "Rutynowe", "Głębokie"};
          static const char *const K_mode[] = {"sweeping", "mopping", "sweeping_and_mopping", "mopping_after_sweeping"};
          static const char *const L_mode[] = {"Odkurzanie", "Mopowanie", "Odk. + mop", "Mop po odk."};
          static const char *const K_suc[] = {"quiet", "standard", "strong", "turbo"};
          static const char *const L_suc[] = {"Cicho", "Standard", "Mocno", "Turbo"};
          static const char *const K_mop[] = {"slightly_dry", "moist", "wet"};
          static const char *const L_mop[] = {"Lekko wilg.", "Wilgotny", "Mokry"};
          std::string cg = id(vac_cg_st).state;
          std::string s;
          if (cg != "off" && cg != "unknown" && cg != "unavailable" && !cg.empty())
            s = "CleanGenius: " + lbl(cg, K_cg, L_cg, 3);
          else
            s = lbl(id(vac_mode_st).state, K_mode, L_mode, 4) + " · " + lbl(id(vac_suc_st).state, K_suc, L_suc, 4) +
                " · mop: " + lbl(id(vac_mop_st).state, K_mop, L_mop, 3);
          s += " · " + std::to_string(id(vac_repeats)) + "×";
          lv_label_set_text(id(vac_opts_lbl), s.c_str());

  - id: vac_buttons_refresh
    then:
      - lambda: |-
          const std::string &st = id(vac_state).state;
          bool busy = st == "cleaning" || st == "returning";
          bool paused = st == "paused";
          size_t n = id(vac_sel).size();
          z2z::enable(id(vac_start), n > 0 && !busy);
          if (n > 0) lv_label_set_text_fmt(id(vac_start_lbl), "Sprzątaj wybrane (%d)", (int) n);
          else lv_label_set_text(id(vac_start_lbl), "Zaznacz pomieszczenia");
          z2z::enable(id(vac_pause), busy);
          z2z::enable(id(vac_resume), paused);
          z2z::enable(id(vac_stop), busy || paused);
          z2z::enable(id(vac_dock), st != "docked");
          z2z::enable(id(vac_mapbtn), !busy);
          lv_obj_t *const r[] = {id(vac_rep_0), id(vac_rep_1), id(vac_rep_2)};
          for (int j = 0; j < 3; j++) z2z::mark(r[j], j == id(vac_repeats) - 1);

