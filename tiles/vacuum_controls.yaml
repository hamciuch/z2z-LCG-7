script:
  - id: vac_clear_selection
    then:
      - lambda: |-
          lv_obj_t *page = id(page_vacuum)->obj;
          uint32_t n = lv_obj_get_child_count(page);
          for (uint32_t i = 0; i < n; i++) {
            lv_obj_t *c = lv_obj_get_child(page, i);
            if (lv_obj_has_flag(c, LV_OBJ_FLAG_CHECKABLE)) lv_obj_remove_state(c, LV_STATE_CHECKED);
          }
          id(vac_sel).clear();
      - script.execute: vac_buttons_refresh

  - id: vac_buttons_refresh
    then:
      - lambda: |-
          const std::string &st = id(vac_state).state;
          bool busy = st == "cleaning" || st == "returning";
          bool paused = st == "paused";
          size_t n = id(vac_sel).size();
          z2z::enable(id(vac_start), n > 0 && !busy);
          if (n > 0) lv_label_set_text_fmt(id(vac_start_lbl), "Sprzątaj wybrane (%d)", (int) n);
          else lv_label_set_text(id(vac_start_lbl), "Zaznacz pomieszczenia");
          z2z::enable(id(vac_clear), n > 0);
          z2z::enable(id(vac_pause), busy);
          z2z::enable(id(vac_resume), paused);
          z2z::enable(id(vac_stop), busy || paused);
          z2z::enable(id(vac_dock), st != "docked");
          z2z::enable(id(vac_mapbtn), !busy);
          lv_obj_t *const r[] = {id(vac_rep_0), id(vac_rep_1), id(vac_rep_2)};
          for (int j = 0; j < 3; j++) z2z::mark(r[j], j == id(vac_repeats) - 1);

