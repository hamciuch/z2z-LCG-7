# Ogrzewanie – encja climate.* (głowica) + czujnik temperatury w pokoju (Zigbee).
# Duża liczba = temperatura z czujnika w pokoju, mała = to, co mierzy głowica.
# Zadana: +/- (krok 0,5°), wysyłana do HA po 1,5 s od ostatniego dotknięcia.
# Karta 385×170 – 4 pokoje mieszczą się 2×2 na ekranie.
# vars: uid, entity, name, room_temp_entity
globals:
  - id: ${uid}_sp
    type: float
    initial_value: "NAN"

sensor:
  - platform: homeassistant
    id: ${uid}_room
    entity_id: ${room_temp_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: ${uid}_room_lbl
          text: !lambda return z2z::fmt(x, 1, "°");
  - platform: homeassistant
    id: ${uid}_cur
    entity_id: ${entity}
    attribute: current_temperature
    internal: true
    on_value:
      - lvgl.label.update:
          id: ${uid}_cur_lbl
          text: !lambda |-
            return isnan(x) ? std::string("") : "głowica " + z2z::fmt(x, 1, "°");
  - platform: homeassistant
    id: ${uid}_set
    entity_id: ${entity}
    attribute: temperature
    internal: true
    on_value:
      - lambda: |-
          if (!id(${uid}_send).is_running()) {
            id(${uid}_sp) = x;
            lv_label_set_text(id(${uid}_sp_lbl), z2z::fmt(x, 1, "°").c_str());
          }

text_sensor:
  - platform: homeassistant
    id: ${uid}_act
    entity_id: ${entity}
    attribute: hvac_action
    internal: true
    on_value:
      - lambda: |-
          bool heat = x == "heating" || x == "preheating";
          z2z::set_text_color(id(${uid}_icon), heat ? z2z::C_HEAT : z2z::C_MUTED);
          lv_label_set_text(id(${uid}_act_lbl), heat ? "Grzeje" : "");

script:
  - id: ${uid}_adj
    parameters:
      delta: float
    then:
      - lambda: |-
          float v = id(${uid}_sp);
          if (isnan(v)) v = id(${uid}_set).state;
          if (isnan(v)) v = 20.0f;
          v = std::max(5.0f, std::min(30.0f, v + delta));
          id(${uid}_sp) = v;
          lv_label_set_text(id(${uid}_sp_lbl), z2z::fmt(v, 1, "°").c_str());
      - script.execute: ${uid}_send
  - id: ${uid}_send
    mode: restart
    then:
      - delay: 1500ms
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: ${entity}
          data_template:
            temperature: "{{ t }}"
          variables:
            t: !lambda return id(${uid}_sp);

lvgl:
  pages:
    - id: !extend page_heating
      widgets:
        - obj:
            styles: card_style
            width: 385
            height: 170
            scrollable: false
            widgets:
              - label:
                  id: ${uid}_icon
                  align: TOP_LEFT
                  text_font: i24
                  text_color: c_muted
                  text: $ic_radiator
              - label:
                  align: TOP_LEFT
                  x: 32
                  y: 2
                  width: 160
                  long_mode: DOT
                  text_font: f18
                  text: "${name}"
              - label:
                  id: ${uid}_act_lbl
                  align: TOP_LEFT
                  x: 32
                  y: 26
                  text_font: f14
                  text_color: c_heat
                  text: ""
              - label:
                  id: ${uid}_room_lbl
                  align: LEFT_MID
                  y: 12
                  text_font: f64
                  text: "--°"
              - label:
                  id: ${uid}_cur_lbl
                  align: BOTTOM_LEFT
                  text_font: f14
                  text_color: c_muted
                  text: ""
              - label:
                  align: TOP_RIGHT
                  x: -62
                  y: 4
                  text_font: f14
                  text_color: c_muted
                  text: "zadana"
              - label:
                  id: ${uid}_sp_lbl
                  align: RIGHT_MID
                  x: -58
                  text_font: f28
                  text_color: c_accent
                  text: "--°"
              - button:
                  align: TOP_RIGHT
                  width: 50
                  height: 50
                  radius: 25
                  on_click:
                    - script.execute: { id: "${uid}_adj", delta: 0.5 }
                  widgets:
                    - label: { align: CENTER, text_font: i32, text: $ic_plus }
              - button:
                  align: BOTTOM_RIGHT
                  width: 50
                  height: 50
                  radius: 25
                  on_click:
                    - script.execute: { id: "${uid}_adj", delta: -0.5 }
                  widgets:
                    - label: { align: CENTER, text_font: i32, text: $ic_minus }
