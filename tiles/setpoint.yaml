# Ogrzewanie – setpoint jako input_number.* / number.* + osobny czujnik temperatury.
# Zmiana wysyłana do HA po 1,5 s od ostatniego dotknięcia.
# vars: uid, name, setpoint_entity, temp_entity, step, min, max
#       heating_entity (opcjonalnie stan "on" = grzeje; np. switch zaworu/pieca)
globals:
  - id: ${uid}_sp
    type: float
    initial_value: "NAN"

sensor:
  - platform: homeassistant
    id: ${uid}_cur
    entity_id: ${temp_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: ${uid}_cur_lbl
          text: !lambda return z2z::fmt(x, 1, "°");
  - platform: homeassistant
    id: ${uid}_set
    entity_id: ${setpoint_entity}
    internal: true
    on_value:
      - lambda: |-
          if (!id(${uid}_send).is_running()) {
            id(${uid}_sp) = x;
            lv_label_set_text(id(${uid}_sp_lbl), z2z::fmt(x, 1, "°").c_str());
          }

text_sensor:
  - platform: homeassistant
    id: ${uid}_act
    entity_id: ${heating_entity}
    internal: true
    on_value:
      - lambda: |-
          bool heat = z2z::is_active(x);
          z2z::set_text_color(id(${uid}_icon), heat ? z2z::C_HEAT : z2z::C_MUTED);
          lv_label_set_text(id(${uid}_act_lbl), heat ? "Grzeje" : "");

script:
  - id: ${uid}_adj
    parameters:
      delta: float
    then:
      - lambda: |-
          float v = id(${uid}_sp);
          if (isnan(v)) v = id(${uid}_set).state;
          if (isnan(v)) v = 20.0f;
          v = std::max((float) ${min}, std::min((float) ${max}, v + delta));
          id(${uid}_sp) = v;
          lv_label_set_text(id(${uid}_sp_lbl), z2z::fmt(v, 1, "°").c_str());
      - script.execute: ${uid}_send
  - id: ${uid}_send
    mode: restart
    then:
      - delay: 1500ms
      - homeassistant.action:
          action: "${setpoint_entity.split('.')[0]}.set_value"
          data:
            entity_id: ${setpoint_entity}
          data_template:
            value: "{{ t }}"
          variables:
            t: !lambda return id(${uid}_sp);

lvgl:
  pages:
    - id: !extend page_heating
      widgets:
        - obj:
            styles: card_style
            width: 372
            height: 170
            scrollable: false
            widgets:
              - label:
                  id: ${uid}_icon
                  align: TOP_LEFT
                  text_font: i32
                  text_color: c_muted
                  text: $ic_radiator
              - label:
                  align: TOP_LEFT
                  x: 42
                  y: 4
                  width: 210
                  long_mode: DOT
                  text_font: f22
                  text: "${name}"
              - label:
                  id: ${uid}_act_lbl
                  align: TOP_RIGHT
                  y: 6
                  text_font: f14
                  text_color: c_muted
                  text: ""
              - label:
                  id: ${uid}_cur_lbl
                  align: LEFT_MID
                  y: 16
                  text_font: f64
                  text: "--°"
              - label:
                  align: BOTTOM_RIGHT
                  x: -64
                  y: -70
                  text_font: f14
                  text_color: c_muted
                  text: "zadana"
              - label:
                  id: ${uid}_sp_lbl
                  align: BOTTOM_RIGHT
                  x: -60
                  y: -6
                  text_font: f40
                  text_color: c_accent
                  text: "--°"
              - button:
                  align: TOP_RIGHT
                  y: 30
                  width: 52
                  height: 52
                  radius: 26
                  on_click:
                    - script.execute: { id: "${uid}_adj", delta: "${step}" }
                  widgets:
                    - label: { align: CENTER, text_font: i32, text: $ic_plus }
              - button:
                  align: BOTTOM_RIGHT
                  width: 52
                  height: 52
                  radius: 26
                  on_click:
                    - script.execute: { id: "${uid}_adj", delta: "-${step}" }
                  widgets:
                    - label: { align: CENTER, text_font: i32, text: $ic_minus }
