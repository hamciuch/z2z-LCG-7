# Roślina: karta na pulpicie "Rośliny" + alert "Podlej" na pulpicie głównym,
# gdy wilgotność spadnie poniżej progu (próg edytowalny w HA / WWW).
# vars: uid, entity (wilgotność gleby %), name, threshold
sensor:
  - platform: homeassistant
    id: ${uid}_m
    entity_id: ${entity}
    internal: true
    on_value:
      - script.execute: ${uid}_eval

number:
  - platform: template
    id: ${uid}_thr
    name: "Próg wilgotności: ${name}"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${threshold}
    entity_category: config
    web_server:
      sorting_group_id: grp_thresholds
    on_value:
      - script.execute: ${uid}_eval

script:
  - id: ${uid}_eval
    mode: restart
    then:
      - lambda: |-
          float v = id(${uid}_m).state;
          float t = id(${uid}_thr).state;
          bool shown = !lv_obj_has_flag(id(${uid}_alert), LV_OBJ_FLAG_HIDDEN);
          // histereza 3 pp, żeby alert nie mrugał
          bool dry = !isnan(v) && (shown ? v < t + 3 : v < t);
          std::string txt = z2z::fmt(v, 0, "%");
          lv_label_set_text(id(${uid}_pct), txt.c_str());
          lv_label_set_text(id(${uid}_aval), txt.c_str());
          lv_label_set_text_fmt(id(${uid}_thr_lbl), "próg %.0f%%", t);
          lv_bar_set_value(id(${uid}_bar), isnan(v) ? 0 : (int) v, LV_ANIM_ON);
          lv_obj_set_style_bg_color(id(${uid}_bar), lv_color_hex(dry ? z2z::C_WARN : 0x29B6F6), LV_PART_INDICATOR);
          if (z2z::set_visible(id(${uid}_alert), dry)) id(wake_screen).execute();
      - script.execute: home_refresh

lvgl:
  pages:
    - id: !extend page_plants
      widgets:
        - obj:
            styles: card_style
            width: 244
            height: 128
            scrollable: false
            widgets:
              - label:
                  align: TOP_LEFT
                  text_font: i32
                  text_color: c_ok
                  text: $ic_sprout
              - label:
                  align: TOP_LEFT
                  x: 40
                  y: 4
                  width: 170
                  long_mode: DOT
                  text_font: f22
                  text: "${name}"
              - label:
                  id: ${uid}_pct
                  align: LEFT_MID
                  y: 10
                  text_font: f28
                  text: "--%"
              - label:
                  id: ${uid}_thr_lbl
                  align: RIGHT_MID
                  y: 10
                  text_font: f14
                  text_color: c_muted
                  text: ""
              - bar:
                  id: ${uid}_bar
                  align: BOTTOM_MID
                  width: 100%
                  height: 10
                  min_value: 0
                  max_value: 100
                  value: 0
                  indicator:
                    bg_color: c_water

    - id: !extend page_home
      widgets:
        - button:
            id: ${uid}_alert
            styles: alert_style
            hidden: true
            on_click:
              - script.execute: { id: goto_page, idx: 5 }
            widgets:
              - label:
                  align: LEFT_MID
                  text_font: i48
                  text_color: c_water
                  text: $ic_water_alert
              - label:
                  align: TOP_LEFT
                  x: 64
                  width: 270
                  long_mode: DOT
                  text_font: f22
                  text: "Podlej: ${name}"
              - label:
                  id: ${uid}_aval
                  align: BOTTOM_LEFT
                  x: 64
                  text_font: f28
                  text_color: c_warn
                  text: ""
