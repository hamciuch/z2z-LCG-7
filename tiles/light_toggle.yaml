# Pulpit "Światła": przełącznik światła (light.* albo switch.*).
# Zapalone = bursztynowy kafelek, dotknięcie = przełącz (homeassistant.toggle).
# Kafelek 148×112 – 5 w rzędzie, 15 mieści się (3×108 px) na ekranie.
# vars: uid, entity, name, icon
# Nazwa na kafelku = opis (friendly_name) z HA; "name" to tylko zapas,
# zanim HA odpowie.
text_sensor:
  - platform: homeassistant
    id: ${uid}_lt
    entity_id: ${entity}
    internal: true
    on_value:
      - lambda: |-
          bool on = z2z::is_active(x);
          bool na = x == "unavailable" || x == "unknown";
          lv_obj_set_style_bg_color(id(${uid}_btn), lv_color_hex(on ? 0x16294A : 0x161B26), 0);
          lv_obj_set_style_border_width(id(${uid}_btn), on ? 2 : 0, 0);
          z2z::set_text_color(id(${uid}_ico), on ? z2z::C_ACCENT : z2z::C_MUTED);
          lv_label_set_text(id(${uid}_st), na ? "niedostępne" : (on ? "włączone" : "wyłączone"));
          lv_obj_set_style_opa(id(${uid}_btn), na ? LV_OPA_50 : LV_OPA_COVER, 0);

  - platform: homeassistant
    id: ${uid}_fn
    entity_id: ${entity}
    attribute: friendly_name
    internal: true
    on_value:
      - lambda: |-
          if (!x.empty()) lv_label_set_text(id(${uid}_nm), x.c_str());

lvgl:
  pages:
    - id: !extend page_lights
      widgets:
        - button:
            id: ${uid}_btn
            width: 148
            height: 108
            radius: 16
            bg_color: c_card
            border_color: c_accent
            border_width: 0
            pad_all: 10
            on_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: ${entity}
            widgets:
              - label:
                  id: ${uid}_ico
                  align: TOP_LEFT
                  text_font: i32
                  text_color: c_muted
                  text: "${icon}"
              - label:
                  id: ${uid}_nm
                  align: BOTTOM_LEFT
                  y: -18
                  width: 126
                  long_mode: DOT
                  height: 24
                  text_font: f16
                  text: "${name}"
              - label:
                  id: ${uid}_st
                  align: BOTTOM_LEFT
                  text_font: f14
                  text_color: c_muted
                  text: ""
