# Karta z wartością liczbową (np. bateria auta, zasięg, paliwo, licznik).
# vars: uid, page (np. page_car), entity, name, icon, unit, decimals
sensor:
  - platform: homeassistant
    id: ${uid}_v
    entity_id: ${entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: ${uid}_lbl
          text: !lambda return z2z::fmt(x, ${decimals}, "${unit}");

lvgl:
  pages:
    - id: !extend ${page}
      widgets:
        - obj:
            styles: card_style
            width: 253
            height: 150
            scrollable: false
            widgets:
              - label:
                  align: TOP_LEFT
                  text_font: i32
                  text_color: c_accent
                  text: "${icon}"
              - label:
                  align: TOP_LEFT
                  x: 42
                  y: 4
                  width: 190
                  long_mode: DOT
                  text_font: f18
                  text_color: c_muted
                  text: "${name}"
              - label:
                  id: ${uid}_lbl
                  align: BOTTOM_LEFT
                  text_font: f40
                  text: "--"
