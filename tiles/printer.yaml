# Drukarka 3D Bambu Lab (integracja ha-bambulab) – kafelek na "Teraz" TYLKO podczas druku:
# postęp z paskiem, przewidywana godzina końca i pozostały czas.
# Gdy nie drukuje – kafelka nie ma.
# Godzinę końca bierze z encji "Czas zakończenia" (znacznik czasu), pozostały czas liczy sam.
# vars: uid, name, status_entity, progress_entity, end_entity (timestamp),
#       printing_states (lista po przecinku)
text_sensor:
  - platform: homeassistant
    id: ${uid}_st
    entity_id: ${status_entity}
    internal: true
    on_value:
      - script.execute: ${uid}_refresh
  - platform: homeassistant
    id: ${uid}_end
    entity_id: ${end_entity}
    internal: true
    on_value:
      - script.execute: ${uid}_refresh

sensor:
  - platform: homeassistant
    id: ${uid}_prog
    entity_id: ${progress_entity}
    internal: true
    on_value:
      - script.execute: ${uid}_refresh

script:
  - id: ${uid}_refresh
    mode: restart
    then:
      - lambda: |-
          bool printing = z2z::in_list(id(${uid}_st).state, "${printing_states}");
          float p = id(${uid}_prog).state;
          lv_bar_set_value(id(${uid}_bar), isnan(p) ? 0 : (int) p, LV_ANIM_ON);
          char b[80] = "";
          int64_t end = z2z::parse_iso(id(${uid}_end).state);
          auto now = id(ha_time).now();
          if (end > 0 && now.is_valid()) {
            auto e = ESPTime::from_epoch_local((time_t) end);
            int rem = (int) ((end - (int64_t) now.timestamp) / 60);
            if (rem < 0) rem = 0;
            bool tomorrow = e.day_of_year != now.day_of_year;
            if (rem >= 60)
              snprintf(b, sizeof(b), "koniec %s%02d:%02d · %d h %02d min", tomorrow ? "jutro " : "",
                       e.hour, e.minute, rem / 60, rem % 60);
            else
              snprintf(b, sizeof(b), "koniec %02d:%02d · %d min", e.hour, e.minute, rem);
          }
          lv_label_set_text(id(${uid}_pct), isnan(p) ? "" : z2z::fmt(p, 0, "%").c_str());
          lv_label_set_text(id(${uid}_info), b);
          z2z::set_visible(id(${uid}_tile), printing);
      - script.execute: home_refresh

interval:
  - interval: 60s
    then:
      - script.execute: ${uid}_refresh

lvgl:
  pages:
    - id: !extend page_home
      widgets:
        - obj:
            id: ${uid}_tile
            styles: tile_style
            width: 306
            hidden: true
            scrollable: false
            widgets:
              - label:
                  align: TOP_LEFT
                  text_font: i32
                  text_color: c_accent
                  text: $ic_printer_3d
              - label:
                  align: TOP_LEFT
                  x: 42
                  text_font: f18
                  text: "${name}"
              - label:
                  id: ${uid}_pct
                  align: TOP_RIGHT
                  text_font: f22
                  text_color: c_accent
                  text: ""
              - label:
                  id: ${uid}_info
                  align: BOTTOM_LEFT
                  y: -16
                  width: 284
                  height: 22
                  long_mode: DOT
                  text_font: f18
                  text: ""
              - bar:
                  id: ${uid}_bar
                  align: BOTTOM_MID
                  width: 100%
                  height: 8
                  min_value: 0
                  max_value: 100
                  value: 0
                  indicator:
                    bg_color: c_accent
