# Ładowanie auta na Teraz:
#  - podłączone: "Ładuje 34% · zostało 1 h 20 min · 21:40" (albo "podłączone, nie ładuje")
#  - od 20:00, niepodłączone i bateria poniżej progu: alert "Podłącz auto"
#    (panel nie wie, czy auto stoi pod domem – dotknięcie chowa alert do rana)
# vars: uid, plug_entity (binary_sensor, on = kabel podłączony), soc_entity, remaining_entity,
#       status_entity, low_soc
globals:
  - { id: "${uid}_dismiss_day", type: int, initial_value: "-1" }

text_sensor:
  - platform: homeassistant
    id: ${uid}_plug
    entity_id: ${plug_entity}
    internal: true
    on_value: { script.execute: "${uid}_draw" }
  - platform: homeassistant
    id: ${uid}_rem
    entity_id: ${remaining_entity}
    internal: true
    on_value: { script.execute: "${uid}_draw" }
  - platform: homeassistant
    id: ${uid}_st
    entity_id: ${status_entity}
    internal: true
    on_value: { script.execute: "${uid}_draw" }

sensor:
  - platform: homeassistant
    id: ${uid}_soc
    entity_id: ${soc_entity}
    internal: true
    on_value: { script.execute: "${uid}_draw" }

interval:
  - interval: 60s
    then:
      - script.execute: ${uid}_draw

script:
  - id: ${uid}_draw
    then:
      - lambda: |-
          bool plugged = id(${uid}_plug).state == "on";
          float soc = id(${uid}_soc).state;
          uint32_t now = z2z::now_ts();
          time_t tn = now; struct tm l{}; localtime_r(&tn, &l);
          int mins = z2z::remaining_mins(id(${uid}_rem).state, now);
          std::string st = z2z::lower(id(${uid}_st).state);
          bool charging = plugged && (mins > 0 || st.find("charg") != std::string::npos || st.find("ładuj") != std::string::npos);
          std::string t = isnan(soc) ? "" : z2z::fmt(soc, 0, "%");
          if (charging && mins > 0) {
            t += " · " + z2z::remaining(id(${uid}_rem).state, now);
            if (now) t += " · " + z2z::hhmm(now + mins * 60);
          } else if (plugged && !charging) {
            t += " · nie ładuje";
          }
          lv_label_set_text(id(${uid}_csub), t.c_str());
          lv_label_set_text(id(${uid}_ctitle), charging ? "Auto ładuje" : "Auto podłączone");
          z2z::set_visible(id(${uid}_ctile), plugged);
          bool evening = now && (l.tm_hour >= 20 || l.tm_hour < 6);
          int day = now ? z2z::local_yday(now - 6 * 3600) : -2;   // "noc" liczona do 6:00
          bool low = !isnan(soc) && soc < ${low_soc};
          bool alert = evening && !plugged && low && id(${uid}_dismiss_day) != day;
          lv_label_set_text(id(${uid}_asub), ("bateria " + t).c_str());
          if (z2z::set_visible(id(${uid}_atile), alert)) id(wake_screen).execute();
      - script.execute: home_refresh

lvgl:
  pages:
    - id: !extend page_home
      widgets:
        - button:
            id: ${uid}_ctile
            styles: tile_style
            hidden: true
            on_click:
              - script.execute: { id: goto_page, idx: 4 }
            widgets:
              - label: { align: TOP_LEFT, text_font: i32, text_color: c_accent, text: $ic_ev_station }
              - label: { id: "${uid}_ctitle", align: BOTTOM_LEFT, y: -20, width: 126, height: 24, long_mode: DOT, text_font: f16, text: "Auto ładuje" }
              - label: { id: "${uid}_csub", align: BOTTOM_LEFT, width: 126, height: 22, long_mode: DOT, text_font: f14, text_color: c_muted, text: "" }
        - button:
            id: ${uid}_atile
            styles: alert_style
            hidden: true
            on_click:
              - lambda: |-
                  uint32_t now = z2z::now_ts();
                  id(${uid}_dismiss_day) = now ? z2z::local_yday(now - 6 * 3600) : -1;
              - script.execute: ${uid}_draw
            widgets:
              - label: { align: LEFT_MID, text_font: i32, text_color: c_warn, text: $ic_car_electric }
              - label: { align: TOP_LEFT, x: 58, width: 222, long_mode: WRAP, text_font: f18, text: "Podłącz auto na noc" }
              - label: { id: "${uid}_asub", align: BOTTOM_LEFT, x: 58, width: 222, long_mode: DOT, text_font: f16, text_color: c_muted, text: "" }
