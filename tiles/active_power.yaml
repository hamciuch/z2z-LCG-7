# Kafelek "aktywne urządzenie" wg poboru mocy (gniazdko z pomiarem:
# ekspres, czajnik, drukarka 3D). Widoczny gdy moc > threshold [W].
# Dotknięcie wyłącza switch_entity (podaj "" jeśli nie chcesz akcji).
# vars: uid, entity (sensor mocy W), name, icon, threshold, switch_entity
sensor:
  - platform: homeassistant
    id: ${uid}_p
    entity_id: ${entity}
    internal: true
    on_value:
      - lambda: |-
          bool on = !isnan(x) && x > ${threshold};
          z2z::set_visible(id(${uid}_tile), on);
          lv_label_set_text(id(${uid}_sub), z2z::fmt(x, 0, " W").c_str());
      - script.execute: home_refresh

lvgl:
  pages:
    - id: !extend page_home
      widgets:
        - button:
            id: ${uid}_tile
            styles: tile_style
            hidden: true
            on_click:
              - if:
                  condition:
                    lambda: return std::string("${switch_entity}").size() > 0;
                  then:
                    - homeassistant.action:
                        action: homeassistant.turn_off
                        data:
                          entity_id: "${switch_entity}"
            widgets:
              - label:
                  align: TOP_LEFT
                  text_font: i32
                  text_color: c_accent
                  text: "${icon}"
              - label:
                  align: BOTTOM_LEFT
                  y: -18
                  width: 126
                  long_mode: DOT
                  text_font: f18
                  text: "${name}"
              - label:
                  id: ${uid}_sub
                  align: BOTTOM_LEFT
                  width: 126
                  long_mode: DOT
                  text_font: f14
                  text_color: c_muted
                  text: ""
