# Zmywarka: karta na pulpicie "Zmywarka" + alert "Wyjmij naczynia" na "Teraz".
# Alert pojawia się, gdy done_entity przejdzie w stan z done_states (koniec programu),
# znika po otwarciu drzwi (door_open_states) albo po dotknięciu. Przetrwa restart panelu.
# vars: uid, name, status_entity, phase_entity, done_entity, done_states,
#       door_entity, door_open_states, remaining_entity (minuty albo znacznik czasu ISO)
globals:
  - id: ${uid}_unload
    type: bool
    restore_value: true
    initial_value: "false"
  - id: ${uid}_last_done
    type: bool
    restore_value: true
    initial_value: "false"

text_sensor:
  - platform: homeassistant
    id: ${uid}_st
    entity_id: ${status_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: ${uid}_state
          text: !lambda return z2z::pl(x);
      - script.execute: ${uid}_refresh

  - platform: homeassistant
    id: ${uid}_phase
    entity_id: ${phase_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: ${uid}_phase_lbl
          text: !lambda return z2z::pl(x);

  - platform: homeassistant
    id: ${uid}_done
    entity_id: ${done_entity}
    internal: true
    on_value:
      - lambda: |-
          if (x == "unavailable" || x == "unknown" || x.empty()) return;
          bool done = z2z::in_list(x, "${done_states}");
          if (done && !id(${uid}_last_done)) id(${uid}_unload) = true;   // zbocze: właśnie skończyła
          id(${uid}_last_done) = done;
      - script.execute: ${uid}_refresh

  - platform: homeassistant
    id: ${uid}_door
    entity_id: ${door_entity}
    internal: true
    on_value:
      - lambda: |-
          bool open = z2z::in_list(x, "${door_open_states}");
          if (open) id(${uid}_unload) = false;
          lv_label_set_text(id(${uid}_door_lbl), open ? "Drzwi otwarte" : "Drzwi zamknięte");
      - script.execute: ${uid}_refresh

  - platform: homeassistant
    id: ${uid}_rem
    entity_id: ${remaining_entity}
    internal: true
    on_value:
      - script.execute: ${uid}_refresh

script:
  - id: ${uid}_refresh
    mode: restart
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          int64_t now_utc = now.is_valid() ? (int64_t) now.timestamp : 0;
          int mins = z2z::remaining_mins(id(${uid}_rem).state, now_utc);
          std::string rem = z2z::remaining(id(${uid}_rem).state, now_utc);
          bool running = mins > 0 || z2z::in_list(id(${uid}_st).state, "run,running,delayedstart,delayed_start,inprogress");
          // kafelek na Teraz: "zostało 1 h 20 min · koniec 19:45"
          std::string sub;
          if (mins > 0) {
            sub = "zostało " + rem;
            if (now_utc > 0) sub += " · " + z2z::hhmm((uint32_t) (now_utc + mins * 60));
          } else {
            sub = z2z::pl(id(${uid}_phase).state);
          }
          lv_label_set_text(id(${uid}_tsub), sub.c_str());
          z2z::set_visible(id(${uid}_tile), running);
          lv_label_set_text(id(${uid}_rem_lbl), running ? ("Pozostało: " + rem).c_str() : "");
          z2z::set_text_color(id(${uid}_icon), running ? z2z::C_ACCENT : (id(${uid}_unload) ? z2z::C_OK : z2z::C_MUTED));
          if (z2z::set_visible(id(${uid}_alert), id(${uid}_unload))) id(wake_screen).execute();
      - script.execute: home_refresh

interval:
  - interval: 60s
    then:
      - script.execute: ${uid}_refresh

lvgl:
  pages:
    - id: !extend page_home
      widgets:
        - button:
            id: ${uid}_tile
            styles: tile_style
            hidden: true
            on_click:
              - script.execute: { id: goto_page, idx: 6 }
            widgets:
              - label: { align: TOP_LEFT, text_font: i32, text_color: c_accent, text: $ic_dishwasher }
              - label: { align: BOTTOM_LEFT, y: -20, width: 126, height: 24, long_mode: DOT, text_font: f16, text: "${name}" }
              - label: { id: "${uid}_tsub", align: BOTTOM_LEFT, width: 126, height: 22, long_mode: DOT, text_font: f14, text_color: c_muted, text: "" }
    - id: !extend page_appliances
      widgets:
        - obj:
            styles: card_style
            width: 100%
            height: 172
            scrollable: false
            widgets:
              - label:
                  id: ${uid}_icon
                  align: LEFT_MID
                  x: 4
                  text_font: i48
                  text_color: c_muted
                  text: $ic_dishwasher
              - label:
                  align: TOP_LEFT
                  x: 70
                  text_font: f18
                  text_color: c_muted
                  text: "${name}"
              - label:
                  id: ${uid}_state
                  align: TOP_LEFT
                  x: 70
                  y: 24
                  text_font: f28
                  text: "--"
              - label:
                  id: ${uid}_phase_lbl
                  align: TOP_LEFT
                  x: 70
                  y: 62
                  text_font: f18
                  text_color: c_muted
                  text: ""
              - label:
                  id: ${uid}_rem_lbl
                  align: BOTTOM_LEFT
                  x: 70
                  text_font: f22
                  text_color: c_accent
                  text: ""
              - label:
                  id: ${uid}_door_lbl
                  align: TOP_RIGHT
                  text_font: f18
                  text_color: c_muted
                  text: ""

    - id: !extend page_home
      widgets:
        - button:
            id: ${uid}_alert
            styles: alert_style
            hidden: true
            on_click:
              - lambda: id(${uid}_unload) = false;
              - script.execute: ${uid}_refresh
            widgets:
              - label:
                  align: LEFT_MID
                  text_font: i32
                  text_color: c_ok
                  text: $ic_dishwasher_alert
              - label:
                  align: TOP_LEFT
                  x: 58
                  width: 222
                  long_mode: WRAP
                  text_font: f18
                  text: "Zmywarka skończyła – wyjmij naczynia"
              - label:
                  align: BOTTOM_LEFT
                  x: 58
                  text_font: f14
                  text_color: c_muted
                  text: "zniknie po otwarciu drzwi (lub dotknij)"
